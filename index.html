<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Akses Sistem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <div class="glass-effect rounded-3xl shadow-xl p-8 border border-white">
            <!-- Header -->
            <div class="text-center mb-8">
                <div class="bg-blue-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-200">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-gray-800">Selamat Datang</h1>
                <p class="text-gray-500 mt-2">Silakan lengkapi data untuk masuk</p>
            </div>

            <!-- Form -->
            <form id="loginForm" class="space-y-5">
                <!-- Input Nama -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Nama Lengkap</label>
                    <input type="text" name="nama" required
                        placeholder="Masukkan nama sesuai KTP"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">
                </div>

                <!-- Input Tanggal Masuk -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Tanggal Masuk</label>
                    <input type="date" name="tanggal_masuk" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">
                </div>

                <!-- Input Nomor HP -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Nomor Handphone</label>
                    <div class="relative">
                        <span class="absolute left-4 top-3 text-gray-400">+62</span>
                        <input type="tel" name="phone" required
                            placeholder="812xxxxxx"
                            class="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">
                    </div>
                </div>

                <!-- Input PIN -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">PIN Keamanan</label>
                    <input type="password" name="pin" required maxlength="6" inputmode="numeric"
                        placeholder="Masukkan 6 digit PIN"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition tracking-widest">
                </div>

                <!-- Message Box -->
                <div id="statusMsg" class="hidden p-3 rounded-xl text-sm text-center"></div>

                <!-- Submit Button -->
                <button type="submit" id="btnSubmit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-200 transform transition active:scale-[0.98]">
                    Login Sekarang
                </button>
            </form>

            <p class="text-center text-xs text-gray-400 mt-8 uppercase tracking-widest font-semibold">
                Koneksi Aman & Terenkripsi
            </p>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzFJ6UPr--QbKJPuM303kV3akOQIr1OTVuujqhCTDL1FpjzpN6U52bS5-p1ZcXSskjN/exec';
        const form = document.getElementById('loginForm');
        const btnSubmit = document.getElementById('btnSubmit');
        const statusMsg = document.getElementById('statusMsg');

        form.addEventListener('submit', e => {
            e.preventDefault();
            
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<span class="flex items-center justify-center">
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg> Memproses...
            </span>`;
            
            statusMsg.className = "hidden";

            const formData = new FormData(form);
            const params = new URLSearchParams();
            for (const pair of formData) {
                params.append(pair[0], pair[1]);
            }
            
            fetch(scriptURL, { 
                method: 'POST', 
                body: params,
                mode: 'no-cors' 
            })
            .then(() => {
                statusMsg.textContent = "Berhasil! Mengalihkan ke Dashboard...";
                statusMsg.className = "p-3 rounded-xl text-sm text-center bg-green-100 text-green-700 mt-4 block";
                
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1000);
            })
            .catch(error => {
                console.error('Error!', error.message);
                statusMsg.textContent = "Gagal mengirim data. Periksa koneksi Anda.";
                statusMsg.className = "p-3 rounded-xl text-sm text-center bg-red-100 text-red-700 mt-4 block";
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = "Login Sekarang";
            });
        });
    </script>
</body>
</html>
