<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Pelacakan Lokasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { background-color: #0f172a; color: white; }
        #map { height: 500px; width: 100%; border-radius: 1rem; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Peta Pelacakan Real-time</h1>
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2">
                <div id="map" class="shadow-2xl border border-gray-700"></div>
            </div>

            <div class="bg-slate-800 p-6 rounded-2xl border border-gray-700 shadow-xl">
                <h2 class="text-xl font-semibold mb-4 text-green-400">Status Lokasi</h2>
                <div id="status-panel" class="space-y-4">
                    <p id="data-info" class="text-lg font-mono text-gray-300">Menghubungkan ke server...</p>
                    <div id="error-msg" class="text-red-400 hidden text-sm">
                        Gagal mengambil data. Pastikan Google Apps Script sudah di-deploy dengan akses "Anyone" (Siapa saja).
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const map = L.map('map').setView([-6.2088, 106.8456], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        const marker = L.marker([-6.2088, 106.8456]).addTo(map);
        
        // URL endpoint baru dari Anda
        const endpoint = "https://script.google.com/macros/s/AKfycbxU4Czs4Ar6taUiddQXRaIBIJY-HfPdfDI2ouVQSZJdTmBNGGDd9mmJWp9Z1XNsLR6LfQ/exec";

        async function fetchLocation() {
            try {
                // Fetch data dengan mode cors
                const response = await fetch(endpoint, {
                    method: 'GET',
                    mode: 'cors'
                });
                
                if (!response.ok) throw new Error('Jaringan tidak merespons');
                
                const data = await response.json();

                // Pastikan format JSON sesuai (lat/lng)
                if (data && data.lat !== undefined && data.lng !== undefined) {
                    const newCoords = [parseFloat(data.lat), parseFloat(data.lng)];
                    map.setView(newCoords, 15);
                    marker.setLatLng(newCoords);
                    document.getElementById('data-info').innerText = `Latitude: ${data.lat}\nLongitude: ${data.lng}`;
                    document.getElementById('error-msg').classList.add('hidden');
                }
            } catch (error) {
                console.error("Kesalahan pengambilan data:", error);
                document.getElementById('error-msg').classList.remove('hidden');
                document.getElementById('data-info').innerText = "Gagal memuat koordinat.";
            }
        }

        // Interval pembaruan data (5 detik)
        setInterval(fetchLocation, 5000);
        fetchLocation();
    </script>
</body>
</html>
