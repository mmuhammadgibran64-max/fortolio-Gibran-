<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peta Tracker</title>
  <!-- Menggunakan Leaflet.js untuk Peta -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    #map { height: 100vh; width: 100%; }
  </style>
</head>
<body>

<div id="map"></div>

<script>
  // Inisialisasi peta
  const map = L.map('map').setView([-6.2088, 106.8456], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);
  
  const marker = L.marker([-6.2088, 106.8456]).addTo(map);

  async function updatePosition() {
    const scriptUrl = 'https://script.google.com/macros/s/AKfycbz7O7TqkmsXedfkVOxX9G53lqzB300uew90K1-LYmdaUyhRC4N3t7qaIdq-VzJq59uLUg/exec';
    
    try {
      // Menggunakan mode no-cors untuk menghindari blokir kebijakan CORS browser
      const response = await fetch(scriptUrl, {
        method: 'GET',
        mode: 'no-cors'
      });
      
      // Catatan: Dengan mode no-cors, kita tidak bisa membaca response.json() secara langsung.
      // Jika error tetap berlanjut, pastikan Google Apps Script Anda mengirimkan data 
      // melalui JSONP atau konfigurasikan header CORS di sisi server secara benar.
      console.log("Permintaan data terkirim (mode no-cors).");
      
      // Jika server Anda mengizinkan CORS, ubah kembali 'no-cors' menjadi 'cors'
      // dan aktifkan kembali baris di bawah ini:
      /*
      const data = await response.json();
      if (data.lat && data.lng) {
        const newLatLng = [parseFloat(data.lat), parseFloat(data.lng)];
        marker.setLatLng(newLatLng);
        map.setView(newLatLng, 15);
      }
      */
    } catch (error) {
      console.error("Gagal mengambil data:", error);
    }
  }

  // Update posisi setiap 5 detik
  setInterval(updatePosition, 5000);
  updatePosition();
</script>

</body>
</html>
