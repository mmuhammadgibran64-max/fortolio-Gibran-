<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gibran Drive - Lokasi Pemantauan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS untuk Peta -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body { 
            background: #050508; 
            color: #f1f5f9; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
        }

        .glass { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }

        #map {
            height: 500px;
            width: 100%;
            border-radius: 2rem;
            z-index: 1;
        }

        /* Filter Dark Mode untuk Peta */
        .leaflet-tile-container img {
            filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) !important;
        }

        .leaflet-container {
            background: #050508 !important;
        }

        .custom-popup .leaflet-popup-content-wrapper {
            background: #1e293b;
            color: white;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .custom-popup .leaflet-popup-tip {
            background: #1e293b;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-10">

    <div class="max-w-5xl mx-auto">
        <!-- Navigasi Kembali -->
        <a href="index.html" class="inline-flex items-center gap-2 text-blue-400 hover:text-blue-300 font-bold mb-8 transition-all group">
            <svg class="w-6 h-6 transform group-hover:-translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path>
            </svg>
            Kembali ke Dashboard
        </a>

        <!-- Header -->
        <header class="mb-10">
            <div class="flex items-center gap-4 mb-4">
                <div class="p-3 bg-blue-500/10 rounded-2xl border border-blue-500/20">
                    <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                </div>
                <h1 class="text-3xl font-extrabold tracking-tight">Lokasi Pemantauan</h1>
            </div>
            <p class="text-gray-400 max-w-2xl">Titik infrastruktur pusat data Gibran Drive di wilayah DKI Jakarta untuk memastikan latensi rendah dan akses cepat.</p>
        </header>

        <!-- Kontainer Peta -->
        <div class="glass p-3 rounded-[2.5rem] shadow-2xl mb-8">
            <div id="map"></div>
        </div>

        <!-- Kartu Detail -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="glass p-6 rounded-3xl border-l-4 border-blue-500">
                <h3 class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2">Koordinat Utama</h3>
                <p class="text-xl font-bold">-6.2088, 106.8456</p>
                <p class="text-xs text-blue-400 mt-1 uppercase font-bold">Jakarta Pusat</p>
            </div>
            <div class="glass p-6 rounded-3xl border-l-4 border-indigo-500">
                <h3 class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2">Node Status</h3>
                <div class="flex items-center gap-2 text-emerald-500 font-bold">
                    <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                    <p class="text-xl">Aktif & Optimal</p>
                </div>
            </div>
            <div class="glass p-6 rounded-3xl border-l-4 border-white/20">
                <h3 class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2">Cakupan Area</h3>
                <p class="text-xl font-bold">Jabodetabek</p>
                <p class="text-xs text-gray-400 mt-1 uppercase font-bold">High Speed Sync</p>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inisialisasi Peta Jakarta
        const map = L.map('map', {
            zoomControl: false
        }).setView([-6.2088, 106.8456], 13);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Tile Layer OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Marker Utama
        const marker = L.marker([-6.2088, 106.8456]).addTo(map);
        
        marker.bindPopup(`
            <div class="text-center p-1">
                <p class="font-black text-sm mb-1">Gibran Drive Hub</p>
                <p class="text-[10px] text-gray-400 uppercase tracking-tighter">Pusat Data Jakarta</p>
            </div>
        `, { className: 'custom-popup' }).openPopup();

        // Fix rendering peta saat window load
        window.addEventListener('load', () => {
            setTimeout(() => {
                map.invalidateSize();
            }, 400);
        });
    </script>
</body>
</html>
