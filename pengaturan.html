<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gibran Drive - Pengaturan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { background: #050508; color: #f1f5f9; font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .input-glass { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: white; transition: all 0.3s ease; }
        .input-glass:focus { outline: none; border-color: #3b82f6; background: rgba(255, 255, 255, 0.08); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-10">

    <div class="max-w-4xl mx-auto">
        <div class="mb-10">
            <a href="dashboard.html" class="text-blue-400 hover:text-blue-300 flex items-center gap-2 mb-4 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Kembali ke Dashboard
            </a>
            <h1 class="text-4xl font-extrabold tracking-tight">Pengaturan</h1>
            <p class="text-gray-500 mt-2">Kelola preferensi akun dan sistem penyimpanan Anda.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="space-y-2">
                <button class="w-full text-left px-6 py-3 rounded-2xl bg-blue-600 text-white font-bold shadow-lg shadow-blue-600/20">Umum</button>
                <button class="w-full text-left px-6 py-3 rounded-2xl hover:bg-white/5 text-gray-400 hover:text-white transition-all">Keamanan</button>
                <button class="w-full text-left px-6 py-3 rounded-2xl hover:bg-white/5 text-gray-400 hover:text-white transition-all">Notifikasi</button>
                <button class="w-full text-left px-6 py-3 rounded-2xl hover:bg-white/5 text-gray-400 hover:text-white transition-all">Penyimpanan</button>
            </div>

            <div class="md:col-span-2 space-y-6">
                <!-- Profil -->
                <div class="glass p-8 rounded-[2.5rem]">
                    <h2 class="text-xl font-bold mb-6 flex items-center gap-3">Informasi Profil</h2>
                    <div class="space-y-4">
                        <input type="text" placeholder="Nama Pengguna" class="w-full px-5 py-3 rounded-xl input-glass">
                        <input type="email" placeholder="Email" class="w-full px-5 py-3 rounded-xl input-glass">
                    </div>
                </div>

                <!-- Lanjutan -->
                <div class="glass p-8 rounded-[2.5rem]">
                    <h2 class="text-xl font-bold mb-6 flex items-center gap-3">Preferensi Sistem</h2>
                    <div class="space-y-6">
                        <button onclick="openLogModal()" class="flex items-center gap-3 font-bold text-blue-400 hover:text-white transition-all w-full">
                            Log Aktivitas
                        </button>
                        <button onclick="clearCache()" class="flex items-center gap-3 font-bold text-red-400 hover:text-red-300 transition-all w-full pt-4 border-t border-white/5">
                            Pembersih Cache
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Log -->
    <div id="logModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="glass w-full max-w-2xl max-h-[80vh] overflow-y-auto p-8 rounded-[2.5rem]">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">Log Aktivitas Terbaru</h2>
                <button onclick="document.getElementById('logModal').classList.add('hidden')" class="text-gray-400">Tutup</button>
            </div>
            <div id="logList" class="space-y-4 text-gray-300">
                Memuat data dari server...
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyHsQWK2SZIuoWY9_rwGpKZ5QNax4eFswPg5_w3PjXCuT-HOjgRpsWdH_-A8-6LX_I8RQ/exec';

        async function openLogModal() {
            document.getElementById('logModal').classList.remove('hidden');
            const list = document.getElementById('logList');
            
            try {
                // Mengambil data dari Google Apps Script
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                
                if (data && data.length > 0) {
                    list.innerHTML = data.map(item => `
                        <div class="p-4 rounded-xl bg-white/5 border border-white/10">
                            <div class="text-xs text-blue-500 font-bold mb-1">${item.timestamp || 'Tanpa waktu'}</div>
                            <div class="font-bold">${item.action || 'Aksi'}</div>
                            <div class="text-sm">Target: ${item.target || '-'}</div>
                            <div class="text-xs text-gray-500 mt-2">Oleh: ${item.user || 'Sistem'}</div>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = '<p>Tidak ada log ditemukan.</p>';
                }
            } catch (error) {
                list.innerHTML = '<p class="text-red-400">Gagal memuat log. Periksa koneksi atau izin script.</p>';
            }
        }

        function clearCache() {
            if(confirm("Yakin ingin menghapus cache?")) alert("Cache dibersihkan.");
        }
    </script>
</body>
</html>
