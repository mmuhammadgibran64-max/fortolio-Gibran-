<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gibran Drive - Pengaturan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body { 
            background: #050508; 
            color: #f1f5f9; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
        }

        .glass { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }

        .input-glass {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }

        .input-glass:focus {
            outline: none;
            border-color: #3b82f6;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .toggle-checkbox:checked {
            right: 0;
            background-color: #3b82f6;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #1e3a8a;
        }

        .loader { 
            border: 2px solid rgba(255,255,255,0.1); 
            border-top: 2px solid #ffffff; 
            border-radius: 50%; 
            width: 16px; 
            height: 16px; 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen p-4 md:p-10">

    <div class="max-w-4xl mx-auto">
        <!-- Breadcrumb & Header -->
        <div class="mb-10">
            <a href="dashboard.html" class="text-blue-400 hover:text-blue-300 flex items-center gap-2 mb-4 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Kembali ke Dashboard
            </a>
            <h1 class="text-4xl font-extrabold tracking-tight">Pengaturan</h1>
            <p class="text-gray-500 mt-2">Kelola preferensi akun dan sistem penyimpanan Anda.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Sidebar Nav -->
            <div class="space-y-2">
                <button class="w-full text-left px-6 py-3 rounded-2xl bg-blue-600 text-white font-bold shadow-lg shadow-blue-600/20">Umum</button>
                <button class="w-full text-left px-6 py-3 rounded-2xl hover:bg-white/5 text-gray-400 hover:text-white transition-all">Keamanan</button>
                <button class="w-full text-left px-6 py-3 rounded-2xl hover:bg-white/5 text-gray-400 hover:text-white transition-all">Notifikasi</button>
                <button class="w-full text-left px-6 py-3 rounded-2xl hover:bg-white/5 text-gray-400 hover:text-white transition-all">Penyimpanan</button>
            </div>

            <!-- Content Area -->
            <div class="md:col-span-2 space-y-6">
                
                <!-- Profil Card -->
                <div class="glass p-8 rounded-[2.5rem]">
                    <h2 class="text-xl font-bold mb-6 flex items-center gap-3">
                        <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        Informasi Profil
                    </h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Nama Pengguna</label>
                            <input type="text" id="username" placeholder="Masukkan nama..." class="w-full px-5 py-3 rounded-xl input-glass">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Email</label>
                            <input type="email" id="email" placeholder="email@contoh.com" class="w-full px-5 py-3 rounded-xl input-glass">
                        </div>
                    </div>
                </div>

                <!-- Sistem Card -->
                <div class="glass p-8 rounded-[2.5rem]">
                    <h2 class="text-xl font-bold mb-6 flex items-center gap-3">
                        <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                        Preferensi Sistem
                    </h2>

                    <div class="space-y-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="font-bold">Mode Gelap (Otomatis)</p>
                                <p class="text-sm text-gray-500">Sesuaikan tampilan dengan sistem perangkat.</p>
                            </div>
                            <div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                                <input type="checkbox" id="darkMode" checked class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                                <label for="darkMode" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-700 cursor-pointer"></label>
                            </div>
                        </div>

                        <div class="flex items-center justify-between">
                            <div>
                                <p class="font-bold">Konfirmasi Penghapusan</p>
                                <p class="text-sm text-gray-500">Tampilkan pesan konfirmasi sebelum menghapus file.</p>
                            </div>
                            <div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                                <input type="checkbox" id="deleteConfirm" checked class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                                <label for="deleteConfirm" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-700 cursor-pointer"></label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Simpan Button -->
                <div class="flex justify-end gap-4">
                    <button class="px-8 py-3 rounded-2xl font-bold hover:bg-white/5 transition-all">Batalkan</button>
                    <button id="saveBtn" onclick="saveSettings()" class="px-8 py-3 rounded-2xl bg-white text-black font-bold hover:bg-blue-50 transition-all active:scale-95 shadow-xl flex items-center gap-2">
                        <span id="btnText">Simpan Perubahan</span>
                        <div id="btnLoader" class="loader hidden"></div>
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 opacity-0 translate-y-10 transition-all duration-500 z-50">
        <div class="bg-blue-600 text-white px-8 py-3 rounded-2xl font-bold shadow-2xl" id="toast-msg">
            Pengaturan Disimpan!
        </div>
    </div>

    <script>
        // URL API Google Apps Script
        const CONFIG_API = 'https://script.google.com/macros/s/AKfycbwsOTWrR8HRKFUG1HpvzdGCoDz4e_Z3FKVcJ2IskniO5RG6D-aj0UswZwPk1BXXt8NR/exec';

        async function saveSettings() {
            const saveBtn = document.getElementById('saveBtn');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');

            // Data yang akan dikirim
            const settingsData = {
                action: 'save_settings',
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                darkMode: document.getElementById('darkMode').checked,
                deleteConfirm: document.getElementById('deleteConfirm').checked
            };

            // Status pemuatan
            saveBtn.disabled = true;
            btnText.innerText = "Menyimpan...";
            btnLoader.classList.remove('hidden');

            try {
                // Mengirim data ke Google Apps Script
                await fetch(CONFIG_API, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(settingsData)
                });

                showToast("Pengaturan Berhasil Disimpan ke Cloud!");
            } catch (error) {
                console.error('Error:', error);
                showToast("Gagal menghubungi server.");
            } finally {
                // Reset status
                saveBtn.disabled = false;
                btnText.innerText = "Simpan Perubahan";
                btnLoader.classList.add('hidden');
            }
        }

        function showToast(m) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = m;
            t.className = "fixed bottom-10 left-1/2 -translate-x-1/2 opacity-100 translate-y-0 transition-all duration-500 z-50";
            setTimeout(() => {
                t.className = "fixed bottom-10 left-1/2 -translate-x-1/2 opacity-0 translate-y-10 transition-all duration-500 z-50";
            }, 3000);
        }
    </script>
</body>
</html>
