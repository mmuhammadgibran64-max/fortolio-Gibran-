<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Settings - GIBRAN DRIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: white; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        input, textarea { background: rgba(255, 255, 255, 0.05) !important; border: 1px solid rgba(255, 255, 255, 0.1) !important; color: white !important; }
    </style>
</head>
<body class="min-h-screen p-6 flex flex-col items-center">

    <header class="w-full max-w-xl flex justify-between items-center mb-8">
        <div>
            <h1 class="text-3xl font-black tracking-tighter text-blue-500">PENGATURAN</h1>
            <p class="text-[10px] font-bold opacity-50 uppercase tracking-[0.2em]">System v.2.3.4 • Status: <span id="status-display" class="text-emerald-500">Ready</span></p>
        </div>
        <a href="dashboard.html" class="bg-white/10 p-3 rounded-2xl hover:bg-white/20 transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
        </a>
    </header>

    <main class="w-full max-w-xl space-y-6">
        <!-- Tampilan Profil Saat Ini (Hanya muncul jika sudah ada data) -->
        <div id="active-profile" class="glass p-6 rounded-[2rem] border-emerald-500/20 border hidden">
            <h3 class="text-[9px] font-bold text-emerald-500 uppercase tracking-widest mb-2">Profil Aktif (Tersinkronisasi)</h3>
            <p id="display-nama" class="text-xl font-black italic">---</p>
            <p id="display-peran" class="text-xs opacity-50">---</p>
        </div>

        <section class="glass p-8 rounded-[2.5rem]">
            <h3 class="text-xs font-bold text-blue-400 uppercase tracking-[0.3em] mb-6">Input Data Baru</h3>
            <div class="space-y-4">
                <div>
                    <label class="text-[9px] font-bold opacity-40 uppercase block mb-1">Nama Profesional</label>
                    <input type="text" id="input-nama" placeholder="Masukkan nama..." class="w-full p-3 rounded-xl text-sm font-semibold">
                </div>
                <div>
                    <label class="text-[9px] font-bold opacity-40 uppercase block mb-1">Peran / Jabatan</label>
                    <input type="text" id="input-peran" placeholder="Contoh: Web Developer" class="w-full p-3 rounded-xl text-sm font-semibold">
                </div>
                <div class="grid grid-cols-1 gap-4">
                    <div>
                        <label class="text-[9px] font-bold opacity-40 uppercase block mb-1">WhatsApp</label>
                        <input type="tel" id="input-hp" placeholder="0812..." class="w-full p-3 rounded-xl text-sm font-semibold">
                    </div>
                </div>
                <div>
                    <label class="text-[9px] font-bold opacity-40 uppercase block mb-1">Narasi Singkat</label>
                    <textarea id="input-narasi" rows="2" placeholder="Tulis bio singkat..." class="w-full p-3 rounded-xl text-sm font-medium"></textarea>
                </div>
                
                <button onclick="kirimKeUpdate()" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-black text-xs uppercase tracking-widest transition-all shadow-lg shadow-blue-600/20 mt-4">
                    PROSES & TERAPKAN PERUBAHAN
                </button>
            </div>
        </section>
    </main>

    <script>
        window.onload = () => {
            // Cek apakah ada data yang sudah tersimpan
            const nama = localStorage.getItem('profile_nama');
            const peran = localStorage.getItem('profile_peran');
            
            if(nama && peran) {
                document.getElementById('active-profile').classList.remove('hidden');
                document.getElementById('display-nama').innerText = nama;
                document.getElementById('display-peran').innerText = peran;
            }
        }

        function kirimKeUpdate() {
            const data = {
                nama: document.getElementById('input-nama').value,
                hp: document.getElementById('input-hp').value,
                peran: document.getElementById('input-peran').value,
                narasi: document.getElementById('input-narasi').value
            };

            if(!data.nama || !data.peran) {
                alert("Nama dan Peran harus diisi!");
                return;
            }

            // Simpan sementara di SESSION, bukan LOCAL (agar tidak langsung muncul di dashboard)
            localStorage.setItem('pending_update', JSON.stringify(data));
            
            // Lari ke mesin update
            window.location.href = `update.html?type=profil`;
        }
    </script>
</body>
</html>
