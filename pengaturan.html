<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gibran Drive - Pengaturan</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

    body { background: #050508; color: #f1f5f9; font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .input-glass { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: white; transition: all 0.3s ease; }
    .input-glass:focus { outline: none; border-color: #3b82f6; background: rgba(255, 255, 255, 0.08); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
    .loader { border: 2px solid rgba(255,255,255,0.1); border-top: 2px solid #ffffff; border-radius: 50%; width: 16px; height: 16px; animation: spin 1px linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body class="min-h-screen p-4 md:p-10">

<div class="max-w-4xl mx-auto">
    <div class="mb-10">
        <a href="dashboard.html" class="text-blue-400 hover:text-blue-300 flex items-center gap-2 mb-4 transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Kembali ke Dashboard
        </a>
        <h1 class="text-4xl font-extrabold tracking-tight">Pengaturan</h1>
        <p class="text-gray-500 mt-2">Kelola preferensi akun dan sistem penyimpanan Anda.</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <div class="space-y-2">
            <button class="w-full text-left px-6 py-3 rounded-2xl bg-blue-600 text-white font-bold shadow-lg shadow-blue-600/20">Umum</button>
            <button class="w-full text-left px-6 py-3 rounded-2xl hover:bg-white/5 text-gray-400 hover:text-white transition-all">Keamanan</button>
            <button class="w-full text-left px-6 py-3 rounded-2xl hover:bg-white/5 text-gray-400 hover:text-white transition-all">Notifikasi</button>
            <button class="w-full text-left px-6 py-3 rounded-2xl hover:bg-white/5 text-gray-400 hover:text-white transition-all">Penyimpanan</button>
        </div>

        <div class="md:col-span-2 space-y-6">
            <div class="glass p-8 rounded-[2.5rem]">
                <h2 class="text-xl font-bold mb-6 flex items-center gap-3">
                    <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    Informasi Profil
                </h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Nama Pengguna</label>
                        <input type="text" id="username" placeholder="Masukkan nama..." class="w-full px-5 py-3 rounded-xl input-glass">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Email</label>
                        <input type="email" id="email" placeholder="email@contoh.com" class="w-full px-5 py-3 rounded-xl input-glass">
                    </div>
                </div>
            </div>

            <div class="glass p-8 rounded-[2.5rem]">
                <h2 class="text-xl font-bold mb-6 flex items-center gap-3">
                    <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                    Preferensi Sistem
                </h2>
                <div class="space-y-6">
                    <div>
                        <a href="https://script.google.com/macros/s/AKfycbznb2Xt7AuTRgd9dcMMV1sLkDs2mtqRA7bRZtEEHB6fxmHRgii8el9JZxGEf6xvPXFJ0g/exec" target="_blank" class="block w-full font-bold text-blue-400 hover:text-white transition-all">Log Aktivitas</a>
                        <p class="text-xs text-gray-500 mt-1">Mencatat: Tanggal/Waktu, Pengguna, Jenis Aktivitas, dan Objek Terkait.</p>
                    </div>
                    
                    <!-- Opsi Ekspor Data Baru -->
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Ekspor Data</label>
                        <select id="exportFormat" class="w-full px-5 py-3 rounded-xl input-glass mb-2">
                            <option value="json">JSON (Data Terstruktur)</option>
                            <option value="csv">CSV (Excel/Sheets)</option>
                            <option value="zip">ZIP (Arsip Dokumen)</option>
                        </select>
                        <button onclick="handleExport()" class="w-full text-center font-bold text-green-400 hover:text-white transition-all bg-green-500/10 hover:bg-green-500/20 py-2 rounded-xl border border-green-500/20">
                            Unduh Sekarang
                        </button>
                    </div>

                    <button onclick="clearCache()" class="flex items-center gap-3 font-bold text-red-400 hover:text-red-300 transition-all w-full pt-4 border-t border-white/5">Pembersih Cache</button>
                </div>
            </div>

            <button id="saveBtn" onclick="saveSettings()" class="w-full px-8 py-3 rounded-2xl bg-white text-black font-bold hover:bg-blue-50 transition-all active:scale-95 shadow-xl flex items-center justify-center gap-2">
                <span id="btnText">Simpan Perubahan</span>
            </button>
        </div>
    </div>
</div>

<div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 opacity-0 translate-y-10 transition-all duration-500 z-50">
    <div class="bg-blue-600 text-white px-8 py-3 rounded-2xl font-bold shadow-2xl" id="toast-msg"></div>
</div>

<script>
    window.onload = () => {
        document.getElementById('username').value = localStorage.getItem('gd_username') || '';
        document.getElementById('email').value = localStorage.getItem('gd_email') || '';
    };

    function handleExport() {
        const format = document.getElementById('exportFormat').value;
        showToast(`Mempersiapkan unduhan dalam format ${format.toUpperCase()}...`);
        // Logika untuk download bisa ditambahkan di sini
        console.log("Ekspor data dengan format: " + format);
    }

    function saveSettings() {
        const btn = document.getElementById('saveBtn');
        const text = document.getElementById('btnText');
        
        btn.disabled = true;
        text.innerHTML = '<div class="loader"></div>';

        setTimeout(() => {
            localStorage.setItem('gd_username', document.getElementById('username').value);
            localStorage.setItem('gd_email', document.getElementById('email').value);
            
            btn.disabled = false;
            text.innerText = "Simpan Perubahan";
            showToast("Pengaturan berhasil disimpan!");
        }, 1000);
    }

    function clearCache() {
        if(confirm("Apakah Anda yakin ingin menghapus cache sistem? Performa akan kembali dioptimalkan.")) {
            localStorage.removeItem('gd_cache_data');
            showToast("Cache berhasil dibersihkan!");
        }
    }
</script>
</body>
</html>
