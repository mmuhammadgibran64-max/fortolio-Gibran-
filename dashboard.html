<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gibran Drive - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body { 
            background: #050508; 
            color: #f1f5f9; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            overflow-x: hidden;
        }

        .glass { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }

        .card-anim { 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        .card-anim:hover { 
            transform: translateY(-8px); 
            background: rgba(255, 255, 255, 0.06); 
            border-color: rgba(255, 255, 255, 0.2); 
            box-shadow: 0 20px 40px -15px rgba(59, 130, 246, 0.15);
        }

        .loader { 
            border: 3px solid rgba(255,255,255,0.1); 
            border-top: 3px solid #3b82f6; 
            border-radius: 50%; 
            width: 20px; 
            height: 20px; 
            animation: spin 1s linear infinite; 
        }

        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        
        .floating-btns {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-float {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        .btn-float:hover {
            transform: scale(1.1) rotate(5deg);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-10">

    <header class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center mb-12 gap-6">
        <div class="flex items-center gap-4">
            <div class="w-14 h-14 bg-gradient-to-tr from-blue-500 to-indigo-600 rounded-2xl flex items-center justify-center shadow-2xl shadow-blue-500/20">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path>
                </svg>
            </div>
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight">Gibran Drive</h1>
                <p class="text-xs text-blue-400 font-bold uppercase tracking-widest">Personal Storage Hub</p>
            </div>
        </div>

        <div class="flex items-center gap-4 w-full md:w-auto">
            <input type="file" id="file-input" class="hidden">
            <button onclick="document.getElementById('file-input').click()" id="upload-btn" class="w-full md:w-auto bg-white text-black hover:bg-blue-50 px-8 py-3.5 rounded-2xl font-bold transition-all active:scale-95 shadow-xl flex items-center justify-center gap-3">
                <svg id="upload-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
                <div id="upload-loader" class="loader hidden"></div>
                <span id="upload-text">Upload File</span>
            </button>
        </div>
    </header>

    <div class="max-w-6xl mx-auto mb-10 grid grid-cols-1 sm:grid-cols-3 gap-6">
        <div class="glass p-6 rounded-3xl">
            <p class="text-gray-500 text-[10px] font-bold uppercase tracking-widest mb-1">Total File</p>
            <p id="stat-count" class="text-2xl font-black text-white">0</p>
        </div>
        <div class="glass p-6 rounded-3xl">
            <p class="text-gray-500 text-[10px] font-bold uppercase tracking-widest mb-1">Status Server</p>
            <div class="flex items-center gap-2">
                <div id="status-indicator" class="w-2 h-2 rounded-full bg-yellow-500"></div>
                <p id="status-db" class="text-xl font-bold text-yellow-500 italic">Menghubungkan...</p>
            </div>
        </div>
        <div class="glass p-6 rounded-3xl border-l-4 border-blue-500">
            <p class="text-gray-500 text-[10px] font-bold uppercase tracking-widest mb-1">Lokasi Pemantauan</p>
            <div class="flex items-center justify-between">
                <p class="text-white font-bold">DKI Jakarta</p>
                <a href="lokasi.html" class="text-blue-400 hover:underline text-xs font-bold">Lihat Peta →</a>
            </div>
        </div>
    </div>

    <main class="max-w-6xl mx-auto">
        <div class="flex items-center justify-between mb-8">
            <h2 class="text-lg font-bold text-gray-400 uppercase tracking-widest">Koleksi File</h2>
            <div class="h-[1px] flex-grow mx-6 bg-white/10"></div>
        </div>
        
        <div id="file-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6">
            <div class="col-span-full py-20 text-center text-gray-600">
                Memuat data dari cloud...
            </div>
        </div>
    </main>

    <div class="floating-btns">
        <a href="lokasi.html" class="btn-float glass bg-indigo-600 text-white border-indigo-400/30 group" title="Lokasi Jakarta">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
        </a>
        <a href="pengaturan.html" class="btn-float glass bg-gray-800 text-white border-white/10 group" title="Pengaturan">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
        </a>
        <!-- Perubahan di sini: Menggunakan whatsapp:// agar langsung buka aplikasi -->
        <a href="whatsapp://send?phone=6285123332018" class="btn-float glass bg-emerald-600 text-white border-emerald-400/30" title="Hubungi Admin">
            <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24">
                <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.246 2.248 3.484 5.232 3.484 8.412-.003 6.557-5.338 11.892-11.893 11.892-1.997-.001-3.951-.5-5.688-1.448l-6.309 1.656zm6.29-4.143c1.589.943 3.547 1.441 5.542 1.442 5.453 0 9.894-4.442 9.897-9.896.002-2.646-1.03-5.132-2.903-7.005-1.871-1.872-4.354-2.903-7.001-2.904-5.452 0-9.892 4.441-9.896 9.896-.001 2.015.51 3.984 1.479 5.762l-.934 3.415 3.516-.91z"/>
            </svg>
        </a>
    </div>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 opacity-0 translate-y-10 transition-all duration-500 z-50 pointer-events-none">
        <div class="bg-blue-600 text-white px-8 py-3 rounded-2xl font-bold shadow-2xl" id="toast-msg">
            Pesan Sistem
        </div>
    </div>

    <script>
        const FILE_API = 'https://script.google.com/macros/s/AKfycbzU0uOTokAefy8If_47UTn8mgHTv6w4exohMvsKZQlz6EE5lYLn-iDC0dzGnJW0X9Q6/exec';

        async function loadData() {
            try {
                const res = await fetch(FILE_API);
                const files = await res.json();
                document.getElementById('status-db').innerText = "Terhubung";
                document.getElementById('status-db').className = "text-xl font-bold text-blue-400 italic";
                document.getElementById('status-indicator').className = "w-2 h-2 rounded-full bg-blue-400";
                renderFiles(files);
            } catch (err) {
                document.getElementById('status-db').innerText = "Gagal";
                document.getElementById('status-db').className = "text-xl font-bold text-red-500 italic";
                document.getElementById('status-indicator').className = "w-2 h-2 rounded-full bg-red-500";
            }
        }

        function renderFiles(files) {
            const grid = document.getElementById('file-grid');
            document.getElementById('stat-count').innerText = files.length;
            grid.innerHTML = '';
            if (files.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-10 text-center text-gray-700 font-bold">Belum ada file di cloud.</div>`;
                return;
            }
            files.forEach(f => {
                const card = document.createElement('div');
                card.className = "glass p-4 rounded-[2rem] card-anim group relative overflow-hidden";
                const isImg = ['jpg', 'png', 'jpeg', 'webp'].includes(f.format?.toLowerCase());
                card.innerHTML = `
                    <div class="aspect-square rounded-[1.5rem] bg-black/40 mb-4 overflow-hidden flex items-center justify-center">
                        ${isImg ? `<img src="${f.viewUrl}" class="w-full h-full object-cover">` : `<span class="text-2xl font-black opacity-20 uppercase">${f.format}</span>`}
                        <div class="absolute inset-0 bg-black/70 opacity-0 group-hover:opacity-100 transition-all flex items-center justify-center gap-3">
                             <a href="${f.url}" target="_blank" class="w-10 h-10 flex items-center justify-center bg-white text-black rounded-xl">
                                 <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                             </a>
                             <button onclick="deleteFile('${f.id}')" class="w-10 h-10 flex items-center justify-center bg-red-500 text-white rounded-xl">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                             </button>
                        </div>
                    </div>
                    <h3 class="text-xs font-bold truncate px-2 text-center">${f.name}</h3>
                `;
                grid.appendChild(card);
            });
        }

        document.getElementById('file-input').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            setLoading(true);
            const reader = new FileReader();
            reader.onload = async (ev) => {
                const base64 = ev.target.result.split(',')[1];
                try {
                    const response = await fetch(FILE_API, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'upload', name: file.name, mimeType: file.type, base64 })
                    });
                    const result = await response.json();
                    if(result.status === 'success') {
                        showToast("Upload Berhasil!");
                        loadData();
                    } else {
                        showToast("Gagal: " + result.message);
                    }
                } catch (err) {
                    showToast("Koneksi Error.");
                } finally {
                    setLoading(false);
                }
            };
            reader.readAsDataURL(file);
        };

        async function deleteFile(id) {
            if (!confirm("Hapus file permanen?")) return;
            try {
                const response = await fetch(FILE_API, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'delete', fileId: id })
                });
                const result = await response.json();
                if(result.status === 'success') {
                    showToast("File Berhasil Dihapus.");
                    loadData();
                }
            } catch (err) {
                showToast("Gagal menghapus.");
            }
        }

        function setLoading(s) {
            document.getElementById('upload-loader').classList.toggle('hidden', !s);
            document.getElementById('upload-icon').classList.toggle('hidden', s);
            document.getElementById('upload-text').innerText = s ? "Mengunggah..." : "Upload File";
            document.getElementById('upload-btn').disabled = s;
            document.getElementById('upload-btn').style.opacity = s ? "0.7" : "1";
        }

        function showToast(m) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = m;
            t.style.opacity = "1";
            t.style.transform = "translate(-50%, 0)";
            setTimeout(() => {
                t.style.opacity = "0";
                t.style.transform = "translate(-50%, 20px)";
            }, 3000);
        }

        window.onload = loadData;
    </script>
</body>
</html>
