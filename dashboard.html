<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - GIBRAN DRIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050508; color: white; margin: 0; overflow-x: hidden; }
        .bg-header { background-color: #0f172a; border-bottom: 1px solid rgba(255,255,255,0.05); } 
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .btn-upload {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        .btn-upload:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(37, 99, 235, 0.4); }
        .loader { border-top-color: #60a5fa; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .fab {
            width: 3.5rem; height: 3.5rem; border-radius: 1.2rem;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease; border: 1px solid rgba(255,255,255,0.1);
        }
        .fab:hover { transform: scale(1.1) rotate(5deg); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-header p-6 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <div class="bg-blue-600 p-2 rounded-xl">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="white">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z" />
                </svg>
            </div>
            <div>
                <h1 class="text-xl font-black tracking-tighter">GIBRAN DRIVE</h1>
                <p class="text-[9px] font-bold tracking-[0.3em] text-blue-500 uppercase">Supabase Storage + Database</p>
            </div>
        </div>
        <div class="text-right">
            <div id="real-time-clock" class="text-2xl font-black text-white tabular-nums tracking-tighter">00:00:00</div>
            <div id="real-time-date" class="text-[10px] font-bold opacity-40 uppercase tracking-widest">-- --- ----</div>
        </div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center p-6 space-y-8">
        <div class="glass-card w-full max-w-3xl rounded-[3rem] p-12 md:p-20 text-center relative overflow-hidden shadow-2xl">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-blue-500 to-transparent opacity-50"></div>
            
            <h2 class="text-4xl font-black mb-4 tracking-tight">Simpan Foto Baru</h2>
            <p class="text-slate-500 mb-12 font-medium text-sm tracking-wide uppercase">Foto yang anda masukkan di sini bisa upload banyak sekaligus</p>
            
            <input type="file" id="file-input" class="hidden" multiple accept="image/*">
            <button id="btn-upload-trigger" class="btn-upload px-14 py-6 rounded-2xl text-lg font-black uppercase tracking-widest shadow-xl active:scale-95">
                PILIH & UNGGAH FOTO
            </button>

            <div id="upload-status" class="mt-10 text-sm font-bold text-blue-400 hidden flex flex-col items-center gap-4">
                <div class="loader w-8 h-8 border-4 rounded-full border-white/10 border-t-blue-500"></div>
                <span id="status-text">Sedang mengunggah...</span>
            </div>
        </div>

        <div id="result-section" class="w-full max-w-3xl hidden">
            <div class="glass-card rounded-[2rem] p-6">
                <h3 class="text-xs font-bold text-blue-500 uppercase tracking-[0.3em] mb-4 text-center">Berhasil Diunggah</h3>
                <div id="file-list" class="space-y-3">
                    <!-- Link file akan muncul di sini -->
                </div>
            </div>
        </div>

        <div class="fixed right-8 bottom-8 flex flex-col gap-4">
            <a href="chat-public-icon.html" title="Public Chat" class="fab bg-blue-600/20 text-blue-500 hover:bg-blue-600 hover:text-white">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" /></svg>
            </a>
            <a href="whatsapp-icon.html" title="WhatsApp" class="fab bg-emerald-600/20 text-emerald-500 hover:bg-emerald-600 hover:text-white">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L0 24l6.335-1.662c1.72.937 3.659 1.432 5.631 1.433h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
            </a>
            <a href="pengaturan.html" title="Pengaturan" class="fab bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
            </a>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://dfalliyygkmomxiurjen.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_XDL0y7JY29GdezwZoz2BZA_zngJ-EM6';
        const BUCKET_NAME = 'foto_user.'; 

        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- Jam Real-time ---
        function updateClock() {
            const now = new Date();
            const clockEl = document.getElementById('real-time-clock');
            if(clockEl) clockEl.innerText = now.toLocaleTimeString('id-ID', { hour12: false });
            
            const options = { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' };
            const dateEl = document.getElementById('real-time-date');
            if(dateEl) dateEl.innerText = now.toLocaleDateString('id-ID', options).toUpperCase();
        }
        setInterval(updateClock, 1000); updateClock();

        // --- Upload File ---
        const fileInput = document.getElementById('file-input');
        const triggerBtn = document.getElementById('btn-upload-trigger');
        const statusEl = document.getElementById('upload-status');
        const statusText = document.getElementById('status-text');
        const resultSection = document.getElementById('result-section');
        const fileList = document.getElementById('file-list');

        triggerBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', async (e) => {
            const files = e.target.files;
            if (files.length === 0) return;

            statusEl.classList.remove('hidden');
            statusText.innerText = `Sedang mengunggah ${files.length} foto...`;
            
            let successCount = 0; 
            let failCount = 0;

            for (const file of files) {
                const fileName = `uploads/${Date.now()}-${file.name.replace(/\s+/g, '_')}`;
                try {
                    const { data, error } = await client.storage.from(BUCKET_NAME).upload(fileName, file);
                    if (error) throw error;
                    
                    successCount++;
                    
                    // --- STREAMING_CHUNK:Generating public URL for visual confirmation... ---
                    const { data: publicUrlData } = client.storage.from(BUCKET_NAME).getPublicUrl(fileName);
                    
                    // Tambahkan ke daftar tampilan
                    const item = document.createElement('div');
                    item.className = "flex items-center justify-between bg-white/5 p-4 rounded-xl border border-white/5 animate-pulse";
                    item.innerHTML = `
                        <div class="flex items-center gap-3">
                            <div class="bg-emerald-500/20 text-emerald-500 p-2 rounded-lg">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
                            </div>
                            <span class="text-xs font-medium opacity-80 truncate max-w-[150px]">${file.name}</span>
                        </div>
                        <a href="${publicUrlData.publicUrl}" target="_blank" class="text-[10px] font-bold text-blue-400 hover:underline">LIHAT FOTO</a>
                    `;
                    fileList.prepend(item);
                    resultSection.classList.remove('hidden');

                } catch (err) {
                    failCount++;
                    console.error("Gagal:", err);
                }
            }

            statusEl.classList.add('hidden');
            if (failCount === 0) {
                // Tidak pakai alert lagi, sudah ada daftar di bawahnya
                statusText.innerText = `Selesai! ${successCount} foto terkirim.`;
            } else {
                alert(`Gagal mengunggah ${failCount} foto. Cek folder 'uploads' di dashboard Supabase.`);
            }
            fileInput.value = '';
        });
    </script>
</body>
</html>
