<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gibran Drive - Cloud Storage Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body { 
            background: #050508; 
            color: #f1f5f9; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            overflow-x: hidden;
        }

        .glass { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }

        .card-anim { 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        .card-anim:hover { 
            transform: translateY(-8px); 
            background: rgba(255, 255, 255, 0.06); 
            border-color: rgba(255, 255, 255, 0.2); 
            box-shadow: 0 20px 40px -15px rgba(59, 130, 246, 0.15);
        }

        .loader { 
            border: 3px solid rgba(255,255,255,0.1); 
            border-top: 3px solid #3b82f6; 
            border-radius: 50%; 
            width: 20px; 
            height: 20px; 
            animation: spin 1s linear infinite; 
        }

        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        
        .floating-wa {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 100;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-10">

    <!-- Header Section -->
    <header class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center mb-12 gap-6">
        <div class="flex items-center gap-4">
            <div class="w-14 h-14 bg-gradient-to-tr from-blue-500 to-indigo-600 rounded-2xl flex items-center justify-center shadow-2xl shadow-blue-500/20">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path>
                </svg>
            </div>
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight">Gibran Drive</h1>
                <p class="text-xs text-blue-400 font-bold uppercase tracking-widest">Penyimpanan Cloud Personal</p>
            </div>
        </div>

        <div class="flex items-center gap-4 w-full md:w-auto">
            <input type="file" id="file-input" class="hidden">
            <button onclick="document.getElementById('file-input').click()" id="upload-btn" class="w-full md:w-auto bg-white text-black hover:bg-blue-50 px-8 py-3.5 rounded-2xl font-bold transition-all active:scale-95 shadow-xl flex items-center justify-center gap-3">
                <svg id="upload-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
                <div id="upload-loader" class="loader hidden"></div>
                <span id="upload-text">Upload File Baru</span>
            </button>
        </div>
    </header>

    <!-- Stats Cards -->
    <div class="max-w-6xl mx-auto mb-10 grid grid-cols-1 sm:grid-cols-3 gap-6">
        <div class="glass p-6 rounded-3xl">
            <p class="text-gray-500 text-[10px] font-bold uppercase tracking-widest mb-1">Total File</p>
            <p id="stat-count" class="text-2xl font-black text-white">0</p>
        </div>
        <div class="glass p-6 rounded-3xl border-l-4 border-emerald-500/50">
            <p class="text-gray-500 text-[10px] font-bold uppercase tracking-widest mb-1">Kapasitas Sisa</p>
            <p class="text-2xl font-black text-emerald-400 italic">Unlimited</p>
        </div>
        <div class="glass p-6 rounded-3xl">
            <p class="text-gray-500 text-[10px] font-bold uppercase tracking-widest mb-1">Status Sinkronisasi</p>
            <div class="flex items-center gap-2">
                <div id="status-indicator" class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></div>
                <p id="status-db" class="text-2xl font-black text-yellow-500 italic">Connecting...</p>
            </div>
        </div>
    </div>

    <!-- Main Grid -->
    <main class="max-w-6xl mx-auto">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-lg font-bold text-gray-400 uppercase tracking-widest px-2">File Terbaru</h2>
            <div class="h-[1px] flex-grow mx-6 bg-white/10"></div>
        </div>
        
        <div id="file-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
            <!-- Loading Placeholder -->
            <div class="col-span-full py-20 text-center animate-pulse text-gray-600 font-medium">
                Mengambil data dari server cloud...
            </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 opacity-0 translate-y-10 transition-all duration-500 z-50">
        <div class="bg-blue-600 text-white px-8 py-3 rounded-2xl font-bold shadow-2xl flex items-center gap-3" id="toast-msg">
            Berhasil!
        </div>
    </div>

    <!-- WhatsApp Floating Action Button -->
    <a href="whatsapp-consultation.html" class="floating-wa glass p-4 rounded-full shadow-2xl border-emerald-500/30 hover:bg-emerald-500 transition-all group">
        <svg class="w-8 h-8 text-emerald-500 group-hover:text-white" fill="currentColor" viewBox="0 0 24 24">
            <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.246 2.248 3.484 5.232 3.484 8.412-.003 6.557-5.338 11.892-11.893 11.892-1.997-.001-3.951-.5-5.688-1.448l-6.309 1.656zm6.29-4.143c1.589.943 3.547 1.441 5.542 1.442 5.453 0 9.894-4.442 9.897-9.896.002-2.646-1.03-5.132-2.903-7.005-1.871-1.872-4.354-2.903-7.001-2.904-5.452 0-9.892 4.441-9.896 9.896-.001 2.015.51 3.984 1.479 5.762l-.934 3.415 3.516-.91z"/>
        </svg>
    </a>

    <script>
        // Gunakan URL Google Apps Script yang sudah Anda update
        const API_URL = 'https://script.google.com/macros/s/AKfycbzU0uOTokAefy8If_47UTn8mgHTv6w4exohMvsKZQlz6EE5lYLn-iDC0dzGnJW0X9Q6/exec';

        // Fungsi untuk mengambil data file
        async function loadFiles() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                // Update Status UI
                const statusLabel = document.getElementById('status-db');
                const statusIndicator = document.getElementById('status-indicator');
                
                statusLabel.innerText = "Terhubung";
                statusLabel.className = "text-2xl font-black text-blue-400";
                statusIndicator.className = "w-2 h-2 rounded-full bg-blue-400";
                
                renderGrid(data);
            } catch (err) {
                console.error(err);
                document.getElementById('status-db').innerText = "Offline";
                document.getElementById('status-db').className = "text-2xl font-black text-red-500";
                document.getElementById('status-indicator').className = "w-2 h-2 rounded-full bg-red-500";
            }
        }

        // Fungsi menampilkan file ke UI
        function renderGrid(files) {
            const grid = document.getElementById('file-grid');
            document.getElementById('stat-count').innerText = files.length;
            grid.innerHTML = '';
            
            if (files.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-20 text-center text-gray-700 italic">Belum ada file. Mulai upload file pertama Anda!</div>`;
                return;
            }

            files.forEach(file => {
                const isImage = ['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(file.format?.toLowerCase());
                const card = document.createElement('div');
                card.className = "glass p-4 rounded-[2.5rem] card-anim group relative overflow-hidden";
                card.innerHTML = `
                    <div class="relative aspect-square rounded-[1.8rem] overflow-hidden bg-black/40 mb-4 flex items-center justify-center">
                        ${isImage ? `<img src="${file.viewUrl}" class="w-full h-full object-cover">` : `<div class="text-3xl font-black text-white/10 uppercase tracking-widest">${file.format}</div>`}
                        
                        <!-- Hover Overlay -->
                        <div class="absolute inset-0 bg-black/80 opacity-0 group-hover:opacity-100 transition-all duration-300 flex flex-col items-center justify-center gap-3">
                            <button onclick="window.open('${file.viewUrl}', '_blank')" class="w-12 h-12 flex items-center justify-center bg-white/10 hover:bg-white text-white hover:text-black rounded-2xl transition-all" title="Pratinjau">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            </button>
                            <div class="flex gap-2">
                                <a href="${file.url}" class="w-10 h-10 flex items-center justify-center bg-blue-500/20 hover:bg-blue-500 text-white rounded-xl transition-all" title="Download">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                </a>
                                <button onclick="deleteFile('${file.id}')" class="w-10 h-10 flex items-center justify-center bg-red-500/20 hover:bg-red-500 text-white rounded-xl transition-all" title="Hapus">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="px-2">
                        <h3 class="text-sm font-bold truncate text-white/90" title="${file.name}">${file.name}</h3>
                        <p class="text-[10px] text-gray-500 font-bold uppercase mt-1 tracking-wider">${(file.size / 1024).toFixed(1)} MB • ${file.format}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Fungsi Upload
        document.getElementById('file-input').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            setLoading(true);
            const reader = new FileReader();
            reader.onload = async (event) => {
                const base64 = event.target.result.split(',')[1];
                const payload = {
                    action: 'upload',
                    name: file.name,
                    mimeType: file.type,
                    base64: base64
                };

                try {
                    await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    showToast("File Berhasil Diupload!");
                    loadFiles();
                } catch (err) {
                    showToast("Gagal mengupload file.");
                } finally {
                    setLoading(false);
                    e.target.value = ''; 
                }
            };
            reader.readAsDataURL(file);
        };

        // Fungsi Hapus
        async function deleteFile(id) {
            if (!confirm("Hapus file ini secara permanen?")) return;
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'delete', fileId: id })
                });
                showToast("File Berhasil Dihapus");
                loadFiles();
            } catch (err) {
                showToast("Gagal menghapus file.");
            }
        }

        function setLoading(s) {
            document.getElementById('upload-text').innerText = s ? "Mengunggah..." : "Upload File Baru";
            document.getElementById('upload-icon').classList.toggle('hidden', s);
            document.getElementById('upload-loader').classList.toggle('hidden', !s);
            document.getElementById('upload-btn').disabled = s;
            document.getElementById('upload-btn').style.opacity = s ? "0.7" : "1";
        }

        function showToast(m) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = m;
            t.classList.replace('opacity-0', 'opacity-100');
            t.classList.replace('translate-y-10', 'translate-y-0');
            setTimeout(() => {
                t.classList.replace('opacity-100', 'opacity-0');
                t.classList.replace('translate-y-0', 'translate-y-10');
            }, 3000);
        }

        // Inisialisasi awal
        window.onload = loadFiles;
    </script>
</body>
</html>
