<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - GIBRAN DRIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050508; color: white; margin: 0; overflow-x: hidden; }
        .bg-header { background-color: #0f172a; border-bottom: 1px solid rgba(255,255,255,0.05); } 
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .btn-upload {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        .btn-upload:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(37, 99, 235, 0.4); }
        .loader { border-top-color: #60a5fa; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .fab {
            width: 3.5rem; height: 3.5rem; border-radius: 1.2rem;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease; border: 1px solid rgba(255,255,255,0.1);
        }
        .fab:hover { transform: scale(1.1) rotate(5deg); }

        #file-list::-webkit-scrollbar { width: 4px; }
        #file-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        
        .animate-fade-in { animation: fadeIn 0.5s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-header p-6 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <div class="bg-blue-600 p-2 rounded-xl">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="white">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z" />
                </svg>
            </div>
            <div>
                <h1 class="text-xl font-black tracking-tighter">GIBRAN DRIVE</h1>
                <p class="text-[9px] font-bold tracking-[0.3em] text-blue-500 uppercase">Cloud File Manager</p>
            </div>
        </div>
        <div class="text-right">
            <div id="real-time-clock" class="text-2xl font-black text-white tabular-nums tracking-tighter">00:00:00</div>
            <div id="real-time-date" class="text-[10px] font-bold opacity-40 uppercase tracking-widest">-- --- ----</div>
        </div>
    </header>

    <main class="flex-1 flex flex-col items-center p-6 space-y-8 mt-10">
        <!-- Upload Card -->
        <div class="glass-card w-full max-w-3xl rounded-[3rem] p-12 text-center relative overflow-hidden shadow-2xl">
            <h2 class="text-4xl font-black mb-4 tracking-tight uppercase">Upload File</h2>
            <p class="text-slate-500 mb-12 font-medium text-sm tracking-wide uppercase">File akan tersimpan permanen di cloud</p>
            
            <input type="file" id="file-input" class="hidden" multiple accept="image/*">
            <button id="btn-upload-trigger" class="btn-upload px-14 py-6 rounded-2xl text-lg font-black uppercase tracking-widest shadow-xl active:scale-95">
                PILIH & UNGGAH
            </button>

            <div id="upload-status" class="mt-10 text-sm font-bold text-blue-400 hidden flex flex-col items-center gap-4">
                <div class="loader w-8 h-8 border-4 rounded-full border-white/10 border-t-blue-500"></div>
                <span id="status-text">Sedang memproses...</span>
            </div>
        </div>

        <!-- Results Section (File Manager) -->
        <div id="result-section" class="w-full max-w-3xl">
            <div class="glass-card rounded-[2rem] p-6">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xs font-bold text-blue-500 uppercase tracking-[0.3em]">Storage Saya</h3>
                    <button onclick="loadFiles()" class="text-[9px] font-black opacity-40 hover:opacity-100 uppercase transition-all tracking-tighter">Refresh Daftar</button>
                </div>
                <div id="file-list" class="space-y-3 max-h-[600px] overflow-y-auto pr-2">
                    <!-- File items will load here -->
                    <div id="empty-state" class="text-center py-10 opacity-20 text-xs font-bold uppercase italic">Belum ada file tersimpan</div>
                </div>
            </div>
        </div>

        <!-- Floating Buttons -->
        <div class="fixed right-8 bottom-8 flex flex-col gap-4">
            <button onclick="location.href='index.html'" class="fab bg-red-600/20 text-red-500 hover:bg-red-600 hover:text-white">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
            </button>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://dfalliyygkmomxiurjen.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_XDL0y7JY29GdezwZoz2BZA_zngJ-EM6';
        const BUCKET_NAME = 'foto_user'; 

        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // UI Elements
        const fileInput = document.getElementById('file-input');
        const triggerBtn = document.getElementById('btn-upload-trigger');
        const statusEl = document.getElementById('upload-status');
        const statusText = document.getElementById('status-text');
        const fileList = document.getElementById('file-list');
        const emptyState = document.getElementById('empty-state');

        // Clock Update
        function updateClock() {
            const now = new Date();
            document.getElementById('real-time-clock').innerText = now.toLocaleTimeString('id-ID', { hour12: false });
            const options = { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' };
            document.getElementById('real-time-date').innerText = now.toLocaleDateString('id-ID', options).toUpperCase();
        }
        setInterval(updateClock, 1000); updateClock();

        // Load Files from Storage (Agar tidak hilang saat refresh)
        async function loadFiles() {
            try {
                // List files in bucket
                const { data, error } = await client.storage.from(BUCKET_NAME).list('', {
                    limit: 100,
                    offset: 0,
                    sortBy: { column: 'created_at', order: 'desc' }
                });

                if (error) throw error;

                fileList.innerHTML = ''; // Kosongkan list dulu
                
                if (data.length === 0) {
                    fileList.appendChild(emptyState);
                    return;
                }

                data.forEach(file => {
                    if(file.name === '.emptyFolderPlaceholder') return;
                    addFileToUI(file.name);
                });

            } catch (err) {
                console.error("Gagal mengambil data:", err);
            }
        }

        // Add file item to UI
        function addFileToUI(fileName) {
            const { data: publicUrlData } = client.storage.from(BUCKET_NAME).getPublicUrl(fileName);
            const url = publicUrlData.publicUrl;
            
            const item = document.createElement('div');
            item.className = "flex items-center justify-between bg-white/5 p-4 rounded-xl border border-white/5 animate-fade-in";
            item.id = `file-${fileName.replace(/[^\w\s]/gi, '')}`;
            
            item.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="bg-blue-500/20 text-blue-500 p-2 rounded-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-[11px] font-bold opacity-90 truncate max-w-[120px] md:max-w-[200px] uppercase">${fileName.split('_').slice(1).join('_') || fileName}</span>
                        <span class="text-[8px] opacity-40 uppercase tracking-tighter">Tersimpan di Cloud</span>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="downloadImage('${url}', '${fileName}')" class="bg-blue-600/20 hover:bg-blue-600 text-blue-400 hover:text-white px-3 py-1.5 rounded-lg text-[8px] font-black uppercase transition-all">
                        Unduh
                    </button>
                    <button onclick="deleteFile('${fileName}')" class="bg-red-600/20 hover:bg-red-600 text-red-500 hover:text-white px-3 py-1.5 rounded-lg text-[8px] font-black uppercase transition-all">
                        Hapus
                    </button>
                </div>
            `;
            fileList.appendChild(item);
        }

        // Upload Logic
        triggerBtn.onclick = () => fileInput.click();
        fileInput.onchange = async (e) => {
            const files = e.target.files;
            if (!files.length) return;

            statusEl.classList.remove('hidden');
            
            for (let file of files) {
                statusText.innerText = `Mengunggah: ${file.name}`;
                const fileName = `${Date.now()}_${file.name.replace(/\s+/g, '_')}`;
                
                try {
                    const { error } = await client.storage.from(BUCKET_NAME).upload(fileName, file);
                    if (error) throw error;
                    
                    // Langsung update list tanpa refresh halaman
                    if (document.getElementById('empty-state')) document.getElementById('empty-state').remove();
                    addFileToUI(fileName);
                    
                } catch (err) {
                    console.error("Gagal upload:", err);
                    alert("Gagal upload: " + err.message);
                }
            }
            
            statusEl.classList.add('hidden');
            fileInput.value = '';
        };

        // Download Logic
        async function downloadImage(url, filename) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = filename;
                link.click();
                window.URL.revokeObjectURL(blobUrl);
            } catch (err) { alert("Download gagal"); }
        }

        // Delete Logic
        async function deleteFile(fileName) {
            if (!confirm("Hapus file ini permanen?")) return;
            
            try {
                const { error } = await client.storage.from(BUCKET_NAME).remove([fileName]);
                if (error) throw error;
                
                // Cari elemen dan hapus dari UI
                const elementId = `file-${fileName.replace(/[^\w\s]/gi, '')}`;
                const el = document.getElementById(elementId);
                if (el) el.remove();
                
                if (fileList.children.length === 0) {
                    fileList.appendChild(emptyState);
                }
            } catch (err) {
                alert("Gagal menghapus: " + err.message);
            }
        }

        // Inisialisasi saat halaman dibuka
        window.onload = loadFiles;
    </script>
</body>
</html>
