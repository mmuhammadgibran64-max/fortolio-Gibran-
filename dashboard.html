<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gibran Drive - Cloud Storage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { background: #050508; color: #f1f5f9; font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .card-anim { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-anim:hover { transform: translateY(-8px); background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.2); }
        .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #3b82f6; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-10">

    <header class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center mb-12 gap-6">
        <div class="flex items-center gap-4">
            <div class="w-14 h-14 bg-gradient-to-tr from-blue-400 to-indigo-600 rounded-2xl flex items-center justify-center shadow-2xl shadow-blue-500/20">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg>
            </div>
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight">Gibran Drive</h1>
                <p class="text-xs text-blue-400 font-bold uppercase tracking-widest">Penyimpanan Cloud Google</p>
            </div>
        </div>

        <div class="flex items-center gap-4 w-full md:w-auto">
            <input type="file" id="file-input" class="hidden">
            <button onclick="document.getElementById('file-input').click()" id="upload-btn" class="w-full md:w-auto bg-white text-black hover:bg-blue-50 px-8 py-3.5 rounded-2xl font-bold transition-all active:scale-95 shadow-xl flex items-center justify-center gap-3">
                <svg id="upload-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
                <div id="upload-loader" class="loader hidden"></div>
                <span id="upload-text">Upload File</span>
            </button>
        </div>
    </header>

    <div class="max-w-6xl mx-auto mb-10 grid grid-cols-1 sm:grid-cols-3 gap-6">
        <div class="glass p-6 rounded-3xl">
            <p class="text-gray-500 text-[10px] font-bold uppercase tracking-widest mb-1">Total Simpanan</p>
            <p id="stat-count" class="text-2xl font-black text-white">0</p>
        </div>
        <div class="glass p-6 rounded-3xl">
            <p class="text-gray-500 text-[10px] font-bold uppercase tracking-widest mb-1">Kapasitas</p>
            <p class="text-2xl font-black text-emerald-400 italic">Unlimited</p>
        </div>
        <div class="glass p-6 rounded-3xl">
            <p class="text-gray-500 text-[10px] font-bold uppercase tracking-widest mb-1">Server Status</p>
            <p id="status-db" class="text-2xl font-black text-yellow-500 italic">Connecting...</p>
        </div>
    </div>

    <main class="max-w-6xl mx-auto">
        <div id="file-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
            <div class="col-span-full py-20 text-center animate-pulse text-gray-600 font-medium">Menghubungkan ke Drive Anda...</div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 opacity-0 translate-y-10 transition-all duration-500 z-50">
        <div class="bg-blue-600 text-white px-8 py-3 rounded-2xl font-bold shadow-2xl flex items-center gap-3" id="toast-msg">
            Berhasil!
        </div>
    </div>

    <script>
        // Gunakan URL Google Apps Script yang sudah Anda update
        const API_URL = 'https://script.google.com/macros/s/AKfycbzU0uOTokAefy8If_47UTn8mgHTv6w4exohMvsKZQlz6EE5lYLn-iDC0dzGnJW0X9Q6/exec';

        // Fungsi untuk mengambil data file
        async function loadFiles() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                document.getElementById('status-db').innerText = "Active";
                document.getElementById('status-db').className = "text-2xl font-black text-blue-400";
                renderGrid(data);
            } catch (err) {
                console.error(err);
                document.getElementById('status-db').innerText = "Error";
                document.getElementById('status-db').className = "text-2xl font-black text-red-500";
            }
        }

        // Fungsi menampilkan file ke UI
        function renderGrid(files) {
            const grid = document.getElementById('file-grid');
            document.getElementById('stat-count').innerText = files.length;
            grid.innerHTML = '';
            
            if (files.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-20 text-center text-gray-700 italic">Belum ada file di Gibran Drive. Silakan upload!</div>`;
                return;
            }

            files.forEach(file => {
                const isImage = ['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(file.format?.toLowerCase());
                const card = document.createElement('div');
                card.className = "glass p-4 rounded-[2rem] card-anim group relative overflow-hidden";
                card.innerHTML = `
                    <div class="relative aspect-square rounded-2xl overflow-hidden bg-black/40 mb-4 flex items-center justify-center">
                        ${isImage ? `<img src="${file.viewUrl}" class="w-full h-full object-cover">` : `<div class="text-3xl font-black text-white/5 uppercase">${file.format}</div>`}
                        
                        <!-- Overlay Tombol -->
                        <div class="absolute inset-0 bg-black/80 opacity-0 group-hover:opacity-100 transition-all duration-300 flex flex-col items-center justify-center gap-3">
                            <button onclick="window.open('${file.viewUrl}', '_blank')" class="w-10 h-10 flex items-center justify-center bg-white/10 hover:bg-white text-white hover:text-black rounded-xl transition-all" title="Lihat">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            </button>
                            <a href="${file.url}" class="w-10 h-10 flex items-center justify-center bg-blue-500/20 hover:bg-blue-500 text-white rounded-xl transition-all" title="Download">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            </a>
                            <button onclick="deleteFile('${file.id}')" class="w-10 h-10 flex items-center justify-center bg-red-500/20 hover:bg-red-500 text-white rounded-xl transition-all" title="Hapus">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    </div>
                    <div class="px-1">
                        <h3 class="text-sm font-bold truncate text-white/90" title="${file.name}">${file.name}</h3>
                        <p class="text-[9px] text-gray-500 font-bold uppercase mt-1 tracking-wider">${file.size} KB • ${file.format}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Fungsi Upload
        document.getElementById('file-input').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            setLoading(true);
            const reader = new FileReader();
            reader.onload = async (event) => {
                const base64 = event.target.result.split(',')[1];
                const payload = {
                    action: 'upload',
                    name: file.name,
                    mimeType: file.type,
                    base64: base64
                };

                try {
                    await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    showToast("File Berhasil Disimpan!");
                    loadFiles();
                } catch (err) {
                    showToast("Gagal mengupload!");
                } finally {
                    setLoading(false);
                    e.target.value = ''; // Reset input
                }
            };
            reader.readAsDataURL(file);
        };

        // Fungsi Hapus
        async function deleteFile(id) {
            if (!confirm("Hapus file ini secara permanen dari Drive?")) return;
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'delete', fileId: id })
                });
                showToast("File Terhapus");
                loadFiles();
            } catch (err) {
                showToast("Gagal menghapus");
            }
        }

        function setLoading(s) {
            document.getElementById('upload-text').innerText = s ? "Sedang Upload..." : "Upload File";
            document.getElementById('upload-icon').style.display = s ? 'none' : 'block';
            document.getElementById('upload-loader').style.display = s ? 'block' : 'none';
        }

        function showToast(m) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = m;
            t.classList.replace('opacity-0', 'opacity-100');
            t.classList.replace('translate-y-10', 'translate-y-0');
            setTimeout(() => {
                t.classList.replace('opacity-100', 'opacity-0');
                t.classList.replace('translate-y-0', 'translate-y-10');
            }, 3000);
        }

        // Load awal
        loadFiles();
    </script>
</body>
</html>
