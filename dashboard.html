<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - GIBRAN DRIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050508; color: white; margin: 0; overflow-x: hidden; }
        .bg-header { background-color: #0f172a; border-bottom: 1px solid rgba(255,255,255,0.05); } 
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .btn-upload {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        .btn-upload:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(37, 99, 235, 0.4); }
        .loader { border-top-color: #60a5fa; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .fab {
            width: 3.5rem; height: 3.5rem; border-radius: 1.2rem;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease; border: 1px solid rgba(255,255,255,0.1);
        }
        .fab:hover { transform: scale(1.1) rotate(5deg); }

        #file-list::-webkit-scrollbar { width: 4px; }
        #file-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-header p-6 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <div class="bg-blue-600 p-2 rounded-xl">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="white">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z" />
                </svg>
            </div>
            <div>
                <h1 class="text-xl font-black tracking-tighter">GIBRAN DRIVE</h1>
                <p class="text-[9px] font-bold tracking-[0.3em] text-blue-500 uppercase">Supabase Storage + Database</p>
            </div>
        </div>
        <div class="text-right">
            <div id="real-time-clock" class="text-2xl font-black text-white tabular-nums tracking-tighter">00:00:00</div>
            <div id="real-time-date" class="text-[10px] font-bold opacity-40 uppercase tracking-widest">-- --- ----</div>
        </div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center p-6 space-y-8">
        <!-- Upload Card -->
        <div class="glass-card w-full max-w-3xl rounded-[3rem] p-12 md:p-20 text-center relative overflow-hidden shadow-2xl">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-blue-500 to-transparent opacity-50"></div>
            
            <h2 class="text-4xl font-black mb-4 tracking-tight">Simpan Foto Baru</h2>
            <p class="text-slate-500 mb-12 font-medium text-sm tracking-wide uppercase">Foto yang anda masukkan di sini bisa upload banyak sekaligus</p>
            
            <input type="file" id="file-input" class="hidden" multiple accept="image/*">
            <button id="btn-upload-trigger" class="btn-upload px-14 py-6 rounded-2xl text-lg font-black uppercase tracking-widest shadow-xl active:scale-95">
                PILIH & UNGGAH FOTO
            </button>

            <div id="upload-status" class="mt-10 text-sm font-bold text-blue-400 hidden flex flex-col items-center gap-4">
                <div class="loader w-8 h-8 border-4 rounded-full border-white/10 border-t-blue-500"></div>
                <span id="status-text">Sedang mengunggah...</span>
            </div>
        </div>

        <!-- Results Section -->
        <div id="result-section" class="w-full max-w-3xl hidden">
            <div class="glass-card rounded-[2rem] p-6">
                <h3 class="text-xs font-bold text-blue-500 uppercase tracking-[0.3em] mb-4 text-center">Berhasil Diunggah</h3>
                <div id="file-list" class="space-y-3 max-h-[400px] overflow-y-auto pr-2">
                </div>
            </div>
        </div>

        <!-- Floating Action Buttons -->
        <div class="fixed right-8 bottom-8 flex flex-col gap-4">
            <button onclick="location.href='index.html'" title="Keluar" class="fab bg-red-600/20 text-red-500 hover:bg-red-600 hover:text-white">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
            </button>
            <!-- Tombol Konsultasi mengarah ke whatsapp-icon.html -->
            <a href="whatsapp-icon.html" title="Public Chat / Konsultasi" class="fab bg-emerald-600/20 text-emerald-500 hover:bg-emerald-600 hover:text-white">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" /></svg>
            </a>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://dfalliyygkmomxiurjen.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_XDL0y7JY29GdezwZoz2BZA_zngJ-EM6';
        const BUCKET_NAME = 'foto_user.'; 

        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function updateClock() {
            const now = new Date();
            const clockEl = document.getElementById('real-time-clock');
            if(clockEl) clockEl.innerText = now.toLocaleTimeString('id-ID', { hour12: false });
            
            const options = { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' };
            const dateEl = document.getElementById('real-time-date');
            if(dateEl) dateEl.innerText = now.toLocaleDateString('id-ID', options).toUpperCase();
        }
        setInterval(updateClock, 1000); updateClock();

        async function downloadImage(url, filename) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                window.URL.revokeObjectURL(blobUrl);
            } catch (err) {
                console.error("Download gagal:", err);
            }
        }

        const fileInput = document.getElementById('file-input');
        const triggerBtn = document.getElementById('btn-upload-trigger');
        const statusEl = document.getElementById('upload-status');
        const statusText = document.getElementById('status-text');
        const resultSection = document.getElementById('result-section');
        const fileList = document.getElementById('file-list');

        triggerBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', async (e) => {
            const files = e.target.files;
            if (files.length === 0) return;

            statusEl.classList.remove('hidden');
            statusText.innerText = `Sedang mengunggah ${files.length} foto...`;
            
            for (const file of files) {
                const fileName = `uploads/${Date.now()}-${file.name.replace(/\s+/g, '_')}`;
                try {
                    const { data, error } = await client.storage.from(BUCKET_NAME).upload(fileName, file);
                    if (error) throw error;
                    
                    const { data: publicUrlData } = client.storage.from(BUCKET_NAME).getPublicUrl(fileName);
                    const url = publicUrlData.publicUrl;
                    
                    const item = document.createElement('div');
                    item.className = "flex items-center justify-between bg-white/5 p-4 rounded-xl border border-white/5 animate-fade-in";
                    item.innerHTML = `
                        <div class="flex items-center gap-3">
                            <div class="bg-emerald-500/20 text-emerald-500 p-2 rounded-lg">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                                </svg>
                            </div>
                            <div class="flex flex-col">
                                <span class="text-[11px] font-bold opacity-90 truncate max-w-[120px] md:max-w-[200px] uppercase">${file.name}</span>
                                <span class="text-[9px] opacity-40 uppercase">Berhasil Disimpan</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <a href="${url}" target="_blank" class="text-[10px] font-black text-blue-400 hover:text-blue-300 tracking-tighter uppercase">Lihat</a>
                            <button onclick="downloadImage('${url}', '${file.name}')" class="bg-blue-600/20 hover:bg-blue-600 text-blue-400 hover:text-white px-3 py-1.5 rounded-lg text-[9px] font-black transition-all uppercase tracking-tighter border border-blue-500/30">
                                Download
                            </button>
                        </div>
                    `;
                    fileList.prepend(item);
                    resultSection.classList.remove('hidden');
                } catch (err) {
                    console.error("Gagal:", err);
                }
            }
            statusEl.classList.add('hidden');
            fileInput.value = '';
        });
    </script>
</body>
</html>
