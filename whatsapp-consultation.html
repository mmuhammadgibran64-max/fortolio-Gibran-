<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konsultasi WhatsApp - Gibran Drive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050508;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Animated Background Gradients */
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.05) 0%, transparent 40%);
            z-index: -1;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            max-width: 480px;
            border-radius: 2.5rem;
            padding: 2.5rem;
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.7);
            position: relative;
        }

        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .input-field {
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px solid rgba(255, 255, 255, 0.07);
            color: white;
            padding: 1.1rem 1rem;
            border-radius: 1.25rem;
            width: 100%;
            outline: none;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            font-size: 0.95rem;
        }

        .input-field:focus {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.03);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
            transform: translateY(-1px);
        }

        .label-text {
            font-size: 0.7rem;
            font-weight: 700;
            color: #10b981;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 0.6rem;
            margin-left: 0.5rem;
            display: block;
            opacity: 0.9;
        }

        .btn-send {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            width: 100%;
            padding: 1.25rem;
            border-radius: 1.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            margin-top: 1.5rem;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-send:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(16, 185, 129, 0.35);
            filter: brightness(1.1);
        }

        .btn-send:active {
            transform: translateY(-1px);
        }

        .btn-send:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-back {
            position: absolute;
            top: 1.75rem;
            left: 1.75rem;
            color: rgba(255,255,255,0.4);
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.04);
            padding: 0.6rem;
            border-radius: 1rem;
            border: 1px solid rgba(255,255,255,0.08);
            z-index: 10;
        }

        .btn-back:hover { 
            color: white; 
            background: rgba(255,255,255,0.1);
            transform: translateX(-4px);
            border-color: rgba(255,255,255,0.2);
        }

        /* Custom Scrollbar for Textarea */
        textarea.input-field {
            resize: none;
        }

        /* Success/Redirect Modal Overlay */
        #loadingOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(5, 5, 8, 0.9);
            backdrop-filter: blur(10px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(16, 185, 129, 0.1);
            border-top: 4px solid #10b981;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <h2 class="text-xl font-bold mb-2">Membuka WhatsApp...</h2>
        <p class="text-slate-400 text-sm">Pastikan aplikasi WhatsApp Anda terpasang.</p>
    </div>

    <div class="glass-card">
        <!-- Back Link to Dashboard -->
        <a href="dashboard.html" class="btn-back" title="Kembali ke Dashboard">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
        </a>

        <div class="text-center mb-8 pt-4">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-emerald-500/10 rounded-3xl mb-6 border border-emerald-500/20 shadow-inner">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z" />
                </svg>
            </div>
            <h1 class="text-3xl font-black tracking-tighter text-white">KONSULTASI</h1>
            <p class="text-slate-500 text-[10px] font-bold uppercase tracking-[0.3em] mt-2 opacity-80">Support Gibran Drive Hub</p>
        </div>

        <form id="waForm" class="space-y-2">
            <div class="input-group">
                <label class="label-text">Nama Lengkap</label>
                <input type="text" id="name" class="input-field" placeholder="Masukkan nama Anda" required>
            </div>

            <div class="input-group">
                <label class="label-text">Nomor WhatsApp</label>
                <input type="tel" id="phone" class="input-field" placeholder="Contoh: 08123456xxx" required>
            </div>

            <div class="input-group">
                <label class="label-text">PIN Keamanan</label>
                <input type="password" id="pin" class="input-field" placeholder="••••••" required maxlength="10">
            </div>

            <div class="input-group">
                <label class="label-text">Deskripsi Kebutuhan</label>
                <textarea id="issue" rows="4" class="input-field" placeholder="Tuliskan keluhan atau pertanyaan Anda secara detail..." required></textarea>
            </div>

            <button type="submit" class="btn-send" id="submitBtn">
                <span>Kirim Konsultasi</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                </svg>
            </button>
        </form>

        <div class="mt-8 flex items-center justify-center gap-3 py-3 border-t border-white/5">
            <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center">
                <svg class="w-4 h-4 text-emerald-500" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766 0-3.18-2.587-5.766-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.312.045-.613.062-1.848-.444-1.579-.647-2.59-2.25-2.669-2.355-.079-.105-.643-.855-.643-1.629 0-.774.405-1.154.548-1.309.143-.155.313-.193.418-.193s.209.002.301.006c.097.004.228-.037.356.273l.487 1.185c.053.129.088.278.002.449-.086.172-.129.281-.258.429-.129.148-.271.329-.387.441-.129.124-.263.26-.113.518.15.258.665 1.097 1.425 1.772.977.868 1.8 1.139 2.058 1.269.258.13.409.108.563-.07s.664-.772.842-1.038c.178-.266.356-.223.6-.134s1.536.724 1.801.857c.266.134.442.198.508.312.066.113.066.655-.079 1.06z"/>
                </svg>
            </div>
            <div class="text-left">
                <p class="text-[9px] text-slate-500 uppercase font-black tracking-widest leading-none">WhatsApp Center</p>
                <p class="text-xs text-slate-300 font-bold tracking-tighter mt-0.5">+62 851-2333-2018</p>
            </div>
        </div>
    </div>

    <script>
        const waForm = document.getElementById('waForm');
        const submitBtn = document.getElementById('submitBtn');
        const loadingOverlay = document.getElementById('loadingOverlay');

        waForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const pin = document.getElementById('pin').value.trim();
            const issue = document.getElementById('issue').value.trim();

            const adminNumber = "6285123332018";
            
            // Structured message with emojis and bold formatting
            const message = `*HALO ADMIN GIBRAN DRIVE 🛡️*\n` +
                            `*FORMULIR KONSULTASI WEB*\n` +
                            `━━━━━━━━━━━━━━━━━━━━\n\n` +
                            `👤 *Identitas Pengguna*\n` +
                            `• Nama: ${name}\n` +
                            `• WhatsApp: ${phone}\n` +
                            `• PIN Keamanan: ${pin}\n\n` +
                            `📝 *Detail Konsultasi*\n` +
                            `${issue}\n\n` +
                            `━━━━━━━━━━━━━━━━━━━━\n` +
                            `_Sent via Gibran Drive Portal_`;

            const encodedMessage = encodeURIComponent(message);
            
            // Show loading state
            loadingOverlay.style.display = 'flex';
            submitBtn.disabled = true;

            // Strategy: Attempt deep link (whatsapp://), fallback to wa.me if not handled
            const directWA = `whatsapp://send?phone=${adminNumber}&text=${encodedMessage}`;
            const fallbackWA = `https://wa.me/${adminNumber}?text=${encodedMessage}`;
            
            // Detect if browser successfully navigated away
            const start = Date.now();
            window.location.href = directWA;

            // Short timeout to check if deep link worked
            setTimeout(() => {
                // If the user is still on this page after 1.5 seconds, try the web link
                if (Date.now() - start < 2000) {
                    window.location.href = fallbackWA;
                }
                
                // Hide loading overlay after some time to allow returning
                setTimeout(() => {
                    loadingOverlay.style.display = 'none';
                    submitBtn.disabled = false;
                }, 3000);
            }, 1500);
        });
    </script>
</body>
</html>
