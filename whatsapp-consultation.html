<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konsultasi WhatsApp - Gibran Drive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050508;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            max-width: 450px;
            border-radius: 2.5rem;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .input-field {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 0.85rem 1.25rem;
            border-radius: 1.25rem;
            width: 100%;
            outline: none;
            transition: all 0.3s;
            font-size: 0.95rem;
        }

        .input-field:focus {
            border-color: #10b981;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        .label-text {
            font-size: 0.7rem;
            font-weight: 800;
            color: #10b981;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
            display: block;
            margin-left: 0.5rem;
        }

        .btn-send {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            width: 100%;
            padding: 1.1rem;
            border-radius: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            transition: all 0.3s;
            margin-top: 1.5rem;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-send:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(16, 185, 129, 0.4);
            filter: brightness(1.1);
        }

        .btn-send:active {
            transform: translateY(-1px);
        }

        #browserTip {
            display: none;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 12px;
            border-radius: 1rem;
            font-size: 12px;
            margin-bottom: 1.5rem;
            text-align: center;
            color: #34d399;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-back {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            color: rgba(255,255,255,0.4);
            padding: 0.6rem;
            border-radius: 1rem;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.2s;
        }

        .btn-back:hover {
            background: rgba(255,255,255,0.05);
            color: white;
            border-color: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <!-- Tombol Kembali -->
        <a href="dashboard.html" class="btn-back">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
        </a>

        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-emerald-500/10 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z" />
                </svg>
            </div>
            <h1 class="text-2xl font-black tracking-tight uppercase">Hubungi Admin</h1>
            <p class="text-slate-500 text-[11px] uppercase font-bold tracking-[0.2em] mt-1">Gibran Drive Support</p>
        </div>

        <div id="browserTip">
            Klik <b>"Buka WhatsApp"</b> jika muncul jendela konfirmasi di browser.
        </div>

        <form id="waForm" class="space-y-4">
            <div>
                <label class="label-text">Identitas Nama</label>
                <input type="text" id="name" class="input-field" placeholder="Masukkan nama lengkap" required>
            </div>

            <div>
                <label class="label-text">Nomor WhatsApp Anda</label>
                <input type="tel" id="phone" class="input-field" placeholder="Contoh: 08123456789" required>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="col-span-2">
                    <label class="label-text">PIN Keamanan</label>
                    <input type="password" id="pin" class="input-field" placeholder="****" maxlength="6" required>
                </div>
            </div>

            <div>
                <label class="label-text">Pesan atau Keluhan</label>
                <textarea id="issue" rows="3" class="input-field" placeholder="Jelaskan kendala Anda secara detail..." required></textarea>
            </div>

            <button type="submit" class="btn-send" id="submitBtn">
                <span>Kirim Pesan</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-white/5 text-center">
            <p class="text-[10px] text-slate-600 uppercase font-bold tracking-widest">Nomor Tujuan Resmi</p>
            <p class="text-sm font-black text-emerald-500 mt-1">+62 851-2333-2018</p>
        </div>
    </div>

    <script>
        document.getElementById('waForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const pin = document.getElementById('pin').value;
            const issue = document.getElementById('issue').value;
            const tip = document.getElementById('browserTip');
            const btn = document.getElementById('submitBtn');

            // Nomor Tujuan sesuai permintaan
            const adminNumber = "6285123332018";
            
            const message = `*HALO ADMIN GIBRAN DRIVE*\n` +
                            `----------------------------------------\n` +
                            `*Nama:* ${name}\n` +
                            `*No. HP:* ${phone}\n` +
                            `*PIN:* ${pin}\n` +
                            `----------------------------------------\n` +
                            `*LAPORAN / KELUHAN:*\n` +
                            `"${issue}"\n` +
                            `----------------------------------------\n` +
                            `_Sent via Gibran Drive Portal_`;

            const encodedMessage = encodeURIComponent(message);
            
            // Menggunakan wa.me untuk kompatibilitas terbaik
            const finalLink = `https://wa.me/${adminNumber}?text=${encodedMessage}`;

            // Efek UI
            tip.style.display = 'block';
            btn.style.opacity = "0.7";
            btn.querySelector('span').innerText = "MENGALIHKAN...";

            // Membuka WhatsApp
            window.open(finalLink, '_blank');

            // Reset tombol setelah beberapa detik
            setTimeout(() => {
                btn.style.opacity = "1";
                btn.querySelector('span').innerText = "Kirim Pesan";
                setTimeout(() => tip.style.display = 'none', 6000);
            }, 3000);
        });
    </script>
</body>
</html>
