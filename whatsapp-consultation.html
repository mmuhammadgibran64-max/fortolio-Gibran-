<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konsultasi WhatsApp - Gibran Drive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050508;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            max-width: 450px;
            border-radius: 2.5rem;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        .input-field {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 1rem;
            border-radius: 1rem;
            width: 100%;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-field:focus {
            border-color: #10b981;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }
        .label-text {
            font-size: 0.65rem;
            font-weight: 800;
            color: #10b981;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
            display: block;
        }
        .btn-send {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            width: 100%;
            padding: 1.25rem;
            border-radius: 1.25rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            transition: all 0.3s;
            margin-top: 1rem;
        }
        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
            filter: brightness(1.1);
        }
        .btn-back {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            color: rgba(255,255,255,0.3);
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.05);
            padding: 0.5rem;
            border-radius: 0.75rem;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
        }
        .btn-back:hover { 
            color: white; 
            background: rgba(255,255,255,0.1);
            transform: translateX(-3px);
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <!-- Perbaikan: Tombol kembali diarahkan ke dashboard.html -->
        <a href="dashboard.html" class="btn-back" title="Kembali ke Dashboard">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
        </a>

        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-500/10 rounded-2xl mb-4 border border-emerald-500/20">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                </svg>
            </div>
            <h1 class="text-3xl font-black tracking-tighter text-white">KONSULTASI</h1>
            <p class="text-slate-500 text-xs font-bold uppercase tracking-widest mt-1">Tim Support Gibran Drive</p>
        </div>

        <form id="waForm" class="space-y-5">
            <div>
                <label class="label-text">Nama Lengkap</label>
                <input type="text" id="name" class="input-field" placeholder="Masukkan nama Anda" required>
            </div>

            <div>
                <label class="label-text">Nomor WhatsApp</label>
                <input type="tel" id="phone" class="input-field" placeholder="Contoh: 08123456789" required>
            </div>

            <div>
                <label class="label-text">PIN Keamanan</label>
                <input type="password" id="pin" class="input-field" placeholder="Masukkan PIN" required>
            </div>

            <div>
                <label class="label-text">Apa yang ingin dikonsultasikan?</label>
                <textarea id="issue" rows="4" class="input-field" placeholder="Tuliskan keluhan atau pertanyaan Anda secara detail..." required></textarea>
            </div>

            <button type="submit" class="btn-send" id="submitBtn">
                Kirim Sekarang
            </button>
        </form>

        <p class="text-center text-[10px] text-slate-600 mt-6 font-medium uppercase tracking-tighter">
            Pesan akan diteruskan otomatis ke <br> <span class="text-slate-400">+62 851-2333-2018</span>
        </p>
    </div>

    <script>
        document.getElementById('waForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const pin = document.getElementById('pin').value;
            const issue = document.getElementById('issue').value;
            const submitBtn = document.getElementById('submitBtn');

            // Nomor admin tujuan tetap sesuai instruksi sebelumnya
            const adminNumber = "6285123332018";

            // Format pesan menggunakan \n untuk baris baru
            const message = `*HALO ADMIN GIBRAN DRIVE*\n` +
                            `----------------------------------------\n` +
                            `*Nama:* ${name}\n` +
                            `*No. HP:* ${phone}\n` +
                            `*PIN:* ${pin}\n` +
                            `----------------------------------------\n` +
                            `*KEBUTUHAN KONSULTASI:*\n` +
                            `${issue}\n` +
                            `----------------------------------------\n` +
                            `_Pesan dikirim dari Formulir Web_`;

            // Encode pesan dengan benar agar karakter khusus terbaca WhatsApp
            const encodedMessage = encodeURIComponent(message);

            // Deteksi perangkat untuk menggunakan skema whatsapp:// yang lebih responsif di mobile
            const isMobile = /iPhone|Android/i.test(navigator.userAgent);
            
            // wa.me sering kali lebih stabil di berbagai browser daripada api.whatsapp.com
            const waUrl = `https://wa.me/${adminNumber}?text=${encodedMessage}`;
            
            // Visual feedback pada tombol
            submitBtn.innerText = "MENGHUBUNGKAN...";
            submitBtn.disabled = true;
            submitBtn.style.opacity = "0.7";

            // Eksekusi pengalihan
            setTimeout(() => {
                window.location.href = waUrl;
                
                // Reset tombol jika pengguna kembali ke halaman ini
                setTimeout(() => {
                    submitBtn.innerText = "Kirim Sekarang";
                    submitBtn.disabled = false;
                    submitBtn.style.opacity = "1";
                }, 2000);
            }, 500);
        });
    </script>
</body>
</html>
