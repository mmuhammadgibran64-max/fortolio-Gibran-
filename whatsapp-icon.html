<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirim Ulasan - PhotoDrive Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0b0f1a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        input, textarea {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: white !important;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            border-color: #25d366 !important;
            outline: none;
            box-shadow: 0 0 15px rgba(37, 211, 102, 0.2);
        }

        .btn-wa {
            background: #25d366;
            color: #075e54;
            transition: all 0.3s ease;
        }

        .btn-wa:hover {
            background: #128c7e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 211, 102, 0.3);
        }

        .back-link {
            transition: all 0.3s ease;
        }
        .back-link:hover {
            color: #25d366;
            transform: translateX(-5px);
        }

        /* Notifikasi Custom */
        #notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ef4444;
            padding: 1rem 2rem;
            border-radius: 12px;
            transform: translateY(-100px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
        }
    </style>
</head>
<body class="p-4">

    <!-- Notifikasi Ganti Alert -->
    <div id="notification" class="flex items-center gap-3 shadow-2xl">
        <i class="fas fa-exclamation-circle"></i>
        <span id="notif-text">Mohon isi semua data!</span>
    </div>

    <div class="glass-card w-full max-w-md p-8 relative">
        <a href="dashboard.html" class="back-link absolute top-8 left-8 text-gray-500 text-sm flex items-center gap-2 mb-6">
            <i class="fas fa-arrow-left"></i> Kembali ke Dashboard
        </a>

        <div class="text-center mb-8 mt-8">
            <div class="inline-block p-4 rounded-2xl bg-green-500/10 mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="#25d366" viewBox="0 0 16 16">
                    <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/>
                </svg>
            </div>
            <h2 class="text-3xl font-extrabold tracking-tight">Kirim Ulasan</h2>
            <p class="text-gray-400 text-sm mt-2">Masukan Anda sangat berarti bagi pengembangan PhotoDrive.</p>
        </div>

        <form id="waForm" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Nama Lengkap</label>
                <input type="text" id="nama" placeholder="Masukkan nama Anda" class="w-full px-4 py-4 rounded-xl outline-none" required>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Nomor WhatsApp</label>
                <input type="tel" id="nomor" placeholder="Contoh: 08123xxx" class="w-full px-4 py-4 rounded-xl outline-none" required>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Ulasan Anda</label>
                <textarea id="ulasan" rows="4" placeholder="Apa pendapat Anda tentang PhotoDrive?" class="w-full px-4 py-4 rounded-xl resize-none outline-none" required></textarea>
            </div>

            <button type="button" onclick="kirimKeWA()" class="btn-wa w-full py-5 rounded-2xl font-black flex items-center justify-center gap-3 mt-6 shadow-lg uppercase tracking-widest text-sm">
                Kirim via WhatsApp <i class="fab fa-whatsapp text-lg"></i>
            </button>
        </form>
    </div>

    <script>
        function showNotif(msg) {
            const notif = document.getElementById('notification');
            const notifText = document.getElementById('notif-text');
            notifText.innerText = msg;
            notif.style.transform = "translateY(0)";
            setTimeout(() => {
                notif.style.transform = "translateY(-100px)";
            }, 3000);
        }

        function kirimKeWA() {
            const targetNo = "6285123332018"; // Nomor Admin
            const nama = document.getElementById('nama').value;
            const nomor = document.getElementById('nomor').value;
            const ulasan = document.getElementById('ulasan').value;

            if(!nama || !nomor || !ulasan) {
                showNotif("Waduh, isi semua datanya dulu ya!");
                return;
            }

            // Menyusun format pesan
            const pesan = `*ULASAN PHOTODRIVE BARU*%0A` +
                          `---------------------------%0A` +
                          `*Nama:* ${nama}%0A` +
                          `*No. WA:* ${nomor}%0A` +
                          `*Ulasan:* ${ulasan}%0A` +
                          `---------------------------%0A` +
                          `_Dikirim via Dashboard PhotoDrive_`;

            // Membuka URL WhatsApp
            const url = `https://wa.me/${targetNo}?text=${pesan}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
