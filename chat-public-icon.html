<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Public Icon - Gibran Drive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0f0f14;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .glass-card {
            background: rgba(25, 25, 30, 0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .chat-area {
            background: rgba(25, 25, 30, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            height: 400px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .message-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scrollbar-width: none;
        }
        .message-list::-webkit-scrollbar { display: none; }

        .bubble {
            max-width: 85%;
            padding: 10px 16px;
            border-radius: 18px;
            font-size: 13px;
            line-height: 1.5;
            animation: slideUp 0.3s ease-out forwards;
        }

        .bubble-other {
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .bubble-me {
            background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(34, 197, 94, 0.1);
            padding: 6px 12px;
            border-radius: 12px;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .btn-icon {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-icon:hover {
            background: rgba(236, 72, 153, 0.2);
            color: #ec4899;
            border-color: #ec4899;
        }

        .input-box {
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 10px 16px;
            color: white;
            font-size: 13px;
            outline: none;
        }
        input:focus { border-color: #ec4899; }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Header / Icon Bar -->
        <div class="glass-card">
            <div class="status-pill">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                </span>
                <span class="text-[10px] font-extrabold text-green-500 uppercase tracking-widest">Online</span>
            </div>

            <div class="h-6 w-[1px] bg-white/10"></div>

            <div class="flex items-center gap-3">
                <button onclick="handleAction('audio')" class="btn-icon" title="Telepon">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                    </svg>
                </button>
                <button onclick="handleAction('video')" class="btn-icon" title="Video">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Chat Area (New) -->
        <div class="chat-area">
            <div id="message-list" class="message-list">
                <!-- Welcome Message -->
                <div class="bubble bubble-other">
                    Halo! Selamat datang di Chat Publik Gibran Drive. Silakan menyapa teman-teman lainnya di sini.
                </div>
            </div>

            <!-- Input Box -->
            <form onsubmit="sendMessage(event)" class="input-box">
                <input type="text" id="msg-input" placeholder="Tulis sesuatu..." autocomplete="off">
                <button type="submit" class="w-10 h-10 bg-pink-500 rounded-xl flex items-center justify-center text-white shadow-lg shadow-pink-500/20 active:scale-90 transition-transform">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-white text-black px-6 py-2.5 rounded-full text-[11px] font-bold shadow-2xl opacity-0 transition-all duration-300 pointer-events-none z-50">
        Pesan terkirim
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwoSB1GvqqiuRQuGT6TpUc55bjKI6wd7lESbzJ_k3SMth39mQFgQ7CpjY_LA9BsMIGgEQ/exec';
        let myId = localStorage.getItem('user_chat_id') || 'u' + Math.floor(Math.random()*1000);
        localStorage.setItem('user_chat_id', myId);

        async function handleAction(type) {
            showToast(`Memulai ${type === 'audio' ? 'Telepon' : 'Video'}...`);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('opacity-100', '-translate-y-4');
            setTimeout(() => toast.classList.remove('opacity-100', '-translate-y-4'), 2500);
        }

        function renderMessage(text, isMe) {
            const list = document.getElementById('message-list');
            const div = document.createElement('div');
            div.className = `bubble ${isMe ? 'bubble-me' : 'bubble-other'}`;
            div.innerText = text;
            list.appendChild(div);
            list.scrollTop = list.scrollHeight;
        }

        async function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if(!text) return;

            renderMessage(text, true);
            input.value = '';

            try {
                // Simulasi pengiriman ke GAS API Anda
                fetch(`${API_URL}?action=send&text=${encodeURIComponent(text)}&userId=${myId}`, {
                    method: 'POST',
                    mode: 'no-cors'
                });
            } catch(err) {
                console.error("Gagal mengirim pesan");
            }
        }
    </script>
</body>
</html>
