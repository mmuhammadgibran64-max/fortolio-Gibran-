<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Chat - Gibran Drive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #050508;
            color: #f1f5f9;
        }
        
        .glass-morphism {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .chat-container {
            height: calc(100vh - 180px);
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.1) transparent;
        }

        .chat-container::-webkit-scrollbar { width: 4px; }
        .chat-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        .bubble-me {
            background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
            border-radius: 20px 20px 4px 20px;
            box-shadow: 0 4px 15px rgba(219, 39, 119, 0.2);
        }

        .bubble-other {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px 20px 20px 4px;
        }

        .animate-pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .loader {
            border: 2px solid rgba(255,255,255,0.1);
            border-top: 2px solid #ec4899;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-0 md:p-4">

    <div id="app" class="w-full max-w-2xl h-screen md:h-[800px] flex flex-col glass-morphism md:rounded-[2.5rem] shadow-2xl overflow-hidden relative">
        
        <!-- Header -->
        <div class="p-6 border-b border-white/10 flex items-center justify-between bg-white/5">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-pink-500 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-pink-500/20 rotate-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 application/json-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z" />
                    </svg>
                </div>
                <div>
                    <h2 class="font-extrabold text-xl tracking-tight">Public Chat</h2>
                    <div class="flex items-center gap-2">
                        <span id="status-dot" class="w-2 h-2 bg-gray-500 rounded-full"></span>
                        <span id="status-text" class="text-xs text-gray-500 font-medium">Menghubungkan...</span>
                    </div>
                </div>
            </div>

            <a href="dashboard.html" class="px-4 py-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-sm font-bold transition-all active:scale-95 flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Dashboard
            </a>
        </div>

        <!-- Chat Window -->
        <div id="chat-window" class="flex-1 overflow-y-auto p-6 space-y-6 chat-container">
            <!-- Empty State -->
             <div id="empty-state" class="flex flex-col items-center justify-center h-full text-gray-600 space-y-4">
                <div class="w-20 h-20 rounded-full bg-white/5 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                    </svg>
                </div>
                <p class="text-sm font-medium">Belum ada obrolan di sini.</p>
             </div>
        </div>

        <!-- Input Area -->
        <div class="p-6 bg-white/5 border-t border-white/10">
            <form id="chat-form" class="flex items-center gap-3">
                <input type="text" id="message-input" placeholder="Tulis pesan sesuatu..." 
                    class="flex-1 bg-white/5 border border-white/10 rounded-2xl px-6 py-4 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500/50 transition-all placeholder:text-gray-600" required autocomplete="off">
                <button type="submit" id="send-btn" class="bg-pink-500 hover:bg-pink-600 text-white p-4 rounded-2xl shadow-lg shadow-pink-500/30 active:scale-95 transition-all disabled:opacity-50">
                    <svg id="send-icon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                    <div id="send-loader" class="loader hidden"></div>
                </button>
            </form>
        </div>

        <!-- Toast -->
        <div id="toast" class="fixed top-24 left-1/2 -translate-x-1/2 bg-white text-black text-xs font-bold px-6 py-3 rounded-full opacity-0 pointer-events-none transition-all duration-500 z-50 shadow-2xl">
            Pesan terkirim!
        </div>
    </div>

    <script>
        // URL API Google Apps Script Anda
        const API_URL = 'https://script.google.com/macros/s/AKfycbyzaI67FHgmX0saRDEyPijn5IWVLT8lSuadYUO3u3NDymhY8YKgpcCb9c6NhX-gdhgyOw/exec';
        
        // Identitas User Sederhana (Random / dari LocalStorage)
        let myId = localStorage.getItem('chat_user_id') || 'user_' + Math.floor(Math.random() * 10000);
        localStorage.setItem('chat_user_id', myId);

        const chatWindow = document.getElementById('chat-window');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');
        const emptyState = document.getElementById('empty-state');
        const sendBtn = document.getElementById('send-btn');
        const sendLoader = document.getElementById('send-loader');
        const sendIcon = document.getElementById('send-icon');

        // Fungsi Memulai
        function init() {
            statusText.innerText = "Terhubung";
            statusText.classList.replace('text-gray-500', 'text-green-500');
            statusDot.classList.replace('bg-gray-500', 'bg-green-500');
            statusDot.classList.add('animate-pulse');
            
            // Polling Pesan setiap 5 detik (Karena No-Cors AppScript terbatas untuk real-time)
            loadMessages();
            setInterval(loadMessages, 5000);
        }

        async function loadMessages() {
            try {
                // Catatan: Mengambil data dari Apps Script biasanya butuh parameter action
                const response = await fetch(`${API_URL}?action=read`);
                const data = await response.json();
                
                if (data && data.length > 0) {
                    emptyState.classList.add('hidden');
                    const currentHTML = chatWindow.innerHTML;
                    
                    // Render ulang hanya jika ada perubahan jumlah pesan untuk efisiensi sederhana
                    chatWindow.innerHTML = '';
                    data.forEach(msg => renderMessage(msg));
                    scrollToBottom();
                }
            } catch (e) {
                console.log("Menunggu data...");
            }
        }

        function renderMessage(msg) {
            const isMe = msg.userId === myId;
            const div = document.createElement('div');
            div.className = `flex ${isMe ? 'justify-end' : 'justify-start'} w-full animate-pop mb-2`;
            
            const time = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '--:--';
            
            div.innerHTML = `
                <div class="max-w-[80%] p-4 ${isMe ? 'bubble-me text-white' : 'bubble-other text-gray-200'}">
                    ${!isMe ? `<p class="text-[10px] font-black mb-1 text-pink-400 uppercase tracking-tighter">${msg.username || 'Anonymous'}</p>` : ''}
                    <p class="text-sm leading-relaxed">${msg.text}</p>
                    <p class="text-[9px] mt-2 opacity-50 text-right font-medium">${time}</p>
                </div>
            `;
            chatWindow.appendChild(div);
        }

        chatForm.onsubmit = async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;

            // UI State
            sendBtn.disabled = true;
            sendIcon.classList.add('hidden');
            sendLoader.classList.remove('hidden');

            const payload = {
                action: 'send',
                userId: myId,
                username: 'User-' + myId.substring(5, 9),
                text: text,
                timestamp: new Date().toISOString()
            };

            try {
                // Kirim ke Google Apps Script
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    body: JSON.stringify(payload)
                });

                // Optimistic UI (Langsung tampilkan di layar)
                emptyState.classList.add('hidden');
                renderMessage(payload);
                scrollToBottom();
                
                messageInput.value = '';
                showToast("Pesan dikirim ke publik!");
            } catch (error) {
                showToast("Gagal mengirim pesan.", true);
            } finally {
                sendBtn.disabled = false;
                sendIcon.classList.remove('hidden');
                sendLoader.classList.add('hidden');
            }
        };

        function scrollToBottom() {
            chatWindow.scrollTo({ top: chatWindow.scrollHeight, behavior: 'smooth' });
        }

        function showToast(m, isError = false) {
            const t = document.getElementById('toast');
            t.innerText = m;
            t.style.backgroundColor = isError ? '#ef4444' : '#ffffff';
            t.style.color = isError ? '#ffffff' : '#000000';
            t.classList.add('opacity-100', 'translate-y-[-10px]');
            setTimeout(() => {
                t.classList.remove('opacity-100', 'translate-y-[-10px]');
            }, 3000);
        }

        window.onload = init;
    </script>
</body>
</html>
